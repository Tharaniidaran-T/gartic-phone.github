<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gartic Phone</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#ff6b6b;--secondary:#4ecdc4;--accent:#ffe66d;--dark:#1a1a2e;
  --purple:#7c4dff;--shadow-lg:0 20px 60px rgba(0,0,0,.18);--r:14px;
}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px;color:var(--dark)}
.container{max-width:1400px;margin:0 auto}
.header{text-align:center;margin-bottom:32px}
.logo{font-size:46px;font-weight:900;background:linear-gradient(135deg,#ff6b6b,#ffe66d,#4ecdc4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-2px}
.tagline{color:#ffffffcc;font-size:15px;margin-top:4px}
.card{background:#fff;border-radius:var(--r);padding:26px;box-shadow:var(--shadow-lg)}
.card-title{font-size:22px;font-weight:800;margin-bottom:18px;color:var(--dark)}
button{padding:13px 22px;border:none;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;transition:all .25s;font-family:inherit;letter-spacing:.6px}
button:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.btn-primary{background:linear-gradient(135deg,var(--primary),#ff5252);color:#fff;box-shadow:0 4px 14px rgba(255,107,107,.35)}
.btn-primary:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(255,107,107,.45)}
.btn-secondary{background:linear-gradient(135deg,var(--secondary),#45b8aa);color:#fff;box-shadow:0 4px 14px rgba(78,205,196,.35)}
.btn-secondary:not(:disabled):hover{transform:translateY(-2px)}
.btn-purple{background:linear-gradient(135deg,#7c4dff,#651fff);color:#fff;box-shadow:0 4px 14px rgba(124,77,255,.35)}
.btn-purple:not(:disabled):hover{transform:translateY(-2px)}
.btn-small{padding:7px 13px;font-size:12px}
.btn-full{width:100%;margin-top:10px}
.input-group{margin-bottom:14px}
.input-group label{display:block;font-weight:700;margin-bottom:6px;font-size:13px}
.input-group input,.input-group select{width:100%;padding:11px 14px;border:2px solid #e0e0e0;border-radius:9px;font-size:14px;transition:all .3s;font-family:inherit;background:#fff}
.input-group input:focus,.input-group select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(255,107,107,.1)}
.info-box{padding:12px 16px;border-radius:9px;margin-bottom:14px;font-size:13px;border-left:4px solid}
.info-blue{background:#e3f2fd;border-color:#2196f3;color:#0d47a1}
.info-green{background:#e8f5e9;border-color:#4caf50;color:#2e7d32}
.info-orange{background:#fff3e0;border-color:#ff9800;color:#e65100}
.info-purple{background:#ede7f6;border-color:#7c4dff;color:#4527a0}
.setup-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.tab-btn{padding:13px;background:#f0f0f0;border:2px solid transparent;border-radius:9px;cursor:pointer;font-weight:700;transition:all .3s;letter-spacing:0;font-size:14px}
.tab-btn.active{background:linear-gradient(135deg,var(--primary),#ff5252);color:#fff}
.screen{display:none}.screen.active{display:block}
.modes-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.mode-card{padding:14px 10px;border:2px solid #e0e0e0;border-radius:12px;cursor:pointer;text-align:center;transition:all .22s;background:#fafafa;position:relative}
.mode-card:hover{border-color:var(--purple);background:#f3efff;transform:translateY(-2px)}
.mode-card.selected{border-color:var(--purple);background:#ede7f6;box-shadow:0 0 0 3px rgba(124,77,255,.2)}
.mode-icon{font-size:26px;margin-bottom:5px}
.mode-name{font-weight:800;font-size:11px;letter-spacing:.5px;color:var(--dark)}
.settings-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:18px}
.game-layout{display:grid;grid-template-columns:280px 1fr 220px;gap:18px;align-items:start}
.sidebar{max-height:70vh;overflow-y:auto}
.chat-panel{max-height:70vh;overflow-y:auto;display:flex;flex-direction:column}
.chat-messages{flex:1;overflow-y:auto;margin-bottom:10px;padding:10px;background:#f9f9f9;border-radius:9px}
.chat-msg{padding:8px;margin-bottom:6px;background:#fff;border-radius:6px;font-size:12px;border-left:3px solid var(--secondary)}
.chat-msg strong{color:var(--primary);font-weight:700}
.chat-input{width:100%;padding:8px;border:2px solid #e0e0e0;border-radius:8px;font-size:12px;resize:none;font-family:inherit}
.chat-input:focus{outline:none;border-color:var(--secondary)}
.players-list{padding:12px;background:#f9f9f9;border-radius:9px;max-height:200px;overflow-y:auto;margin-top:10px}
.player-item{padding:8px 10px;background:#fff;border-radius:6px;margin-bottom:6px;font-size:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.player-item:last-child{margin-bottom:0}
.badge{font-size:10px;padding:2px 7px;border-radius:15px;font-weight:700}
.badge-host{background:#fff3cd;color:#856404}
.badge-ready{background:#d1f7e0;color:#166534}
.badge-done{background:#e3f2fd;color:#0d47a1}
.badge-drawer{background:#ffe8e8;color:#9b1c1c}
.turn-indicator{padding:12px 16px;background:linear-gradient(135deg,var(--accent),#ffd54f);border-radius:9px;margin-bottom:12px;font-weight:800;text-align:center;color:var(--dark);font-size:13px}
.canvas-wrap{border-radius:10px;overflow:hidden;box-shadow:inset 0 0 0 2px #e0e0e0;margin-bottom:14px;background:#fff}
canvas{display:block;cursor:crosshair;width:100%;background:#fff}
.tools-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.color-picker{width:40px;height:40px;border:none;border-radius:8px;cursor:pointer;flex-shrink:0}
.slider-group{display:flex;flex-direction:column;gap:3px;flex:1;min-width:70px}
.slider-group label{font-size:11px;font-weight:700;color:#666}
input[type=range]{cursor:pointer;width:100%}
.tool-buttons{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tool-btn{padding:8px 12px;background:#f0f0f0;border:2px solid transparent;border-radius:8px;cursor:pointer;font-size:11px;font-weight:700;transition:all .2s}
.tool-btn.active{background:var(--accent);border-color:var(--primary)}
.tool-btn:hover:not(.active){background:#e0e0e0}
.phase-panel{display:none}.phase-panel.active{display:block}
.story-input{width:100%;padding:12px 14px;border:2px solid #e0e0e0;border-radius:9px;font-size:14px;margin-bottom:12px;font-family:inherit;resize:vertical;min-height:80px}
.story-input:focus{outline:none;border-color:var(--secondary);box-shadow:0 0 0 3px rgba(78,205,196,.12)}
.guess-input{width:100%;padding:12px 14px;border:2px solid #e0e0e0;border-radius:9px;font-size:15px;margin-bottom:12px;font-family:inherit}
.guess-input:focus{outline:none;border-color:var(--secondary)}
.chain-display{background:#f9f9f9;border-radius:9px;padding:16px;margin-bottom:18px;max-height:500px;overflow-y:auto}
.chain-item{margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #eee}
.chain-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.chain-player{font-weight:800;color:var(--primary);font-size:10px;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.chain-content{font-size:14px;color:var(--dark);font-style:italic}
.chain-image{width:100%;border-radius:6px;margin-top:4px;border:1px solid #e0e0e0;max-height:250px;object-fit:contain}
.prompt-box{padding:12px 14px;background:#fff3cd;border-radius:9px;border-left:4px solid var(--accent);margin-bottom:12px}
.timer-bar-wrap{height:8px;background:#e0e0e0;border-radius:4px;overflow:hidden;margin-bottom:10px;display:none}
.timer-bar{height:100%;width:100%;background:linear-gradient(90deg,#4caf50,#ffeb3b,#f44336);border-radius:4px;transition:width 1s linear}
.timer-text{text-align:right;font-size:11px;font-weight:700;color:#888;margin-top:-6px;margin-bottom:6px}
.waiting-panel-inner{text-align:center;padding:30px 20px}
code{background:#f0f0f0;padding:3px 8px;border-radius:5px;font-size:12px;letter-spacing:2px}
.knockoff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.knockoff-item{border-radius:8px;overflow:hidden;border:1px solid #e0e0e0}
.knockoff-label{padding:5px 8px;background:#f9f9f9;font-size:11px;font-weight:700;color:#666}
@media(max-width:1000px){
  .game-layout{grid-template-columns:1fr}
  .chat-panel{display:none}
}
@media(max-width:700px){
  .game-layout{grid-template-columns:1fr}
  .modes-grid{grid-template-columns:repeat(2,1fr)}
  .logo{font-size:32px}
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">Gartic Phone</div>
    <div class="tagline">Draw it. Guess it. Share the chaos.</div>
  </div>

  <!-- SETUP -->
  <div id="screenSetup" class="screen active">
    <div class="card" style="max-width:520px;margin:0 auto">
      <div class="card-title">Welcome 🎨</div>
      <div id="firebaseStatus" class="info-box info-blue">⏳ Connecting…</div>
      <div class="setup-tabs">
        <button class="tab-btn active" id="tabCreate" onclick="switchTab('create')">Create Room</button>
        <button class="tab-btn" id="tabJoin" onclick="switchTab('join')">Join Room</button>
      </div>
      <div id="createTab">
        <div class="input-group"><label>Your Name</label><input id="playerName" placeholder="e.g. SketchMaster" maxlength="20"></div>
        <div class="input-group"><label>Room Name</label><input id="roomName" placeholder="Fun Room" maxlength="30"></div>
        <div class="input-group"><label>Max Players (2–8)</label><input id="maxPlayers" type="number" min="2" max="8" value="4"></div>
        <button class="btn-purple btn-full" onclick="goModeSelect()">Choose Game Mode →</button>
      </div>
      <div id="joinTab" style="display:none">
        <div class="input-group"><label>Your Name</label><input id="joinPlayerName" placeholder="Your name" maxlength="20"></div>
        <div class="input-group"><label>Room Code</label><input id="roomCode" placeholder="6-character code" maxlength="6" style="text-transform:uppercase"></div>
        <button class="btn-primary btn-full" onclick="joinRoom()">Join Room</button>
      </div>
    </div>
  </div>

  <!-- MODE SELECT -->
  <div id="screenMode" class="screen">
    <div class="card" style="max-width:800px;margin:0 auto">
      <div class="card-title">Choose Game Mode</div>
      <div class="modes-grid" id="modesGrid"></div>
      <div id="modeDesc" class="info-box info-purple" style="min-height:40px;margin-bottom:18px;font-size:12px"></div>

      <div style="font-weight:800;font-size:14px;margin-bottom:10px;color:var(--dark)">⏱️ Settings</div>
      <div class="settings-grid">
        <div class="input-group" style="margin-bottom:0">
          <label>Draw Time</label>
          <select id="settingDrawTime" style="font-size:12px">
            <option value="30">30s</option>
            <option value="60">60s</option>
            <option value="90" selected>90s</option>
            <option value="120">120s</option>
          </select>
        </div>
        <div class="input-group" style="margin-bottom:0">
          <label>Guess Time</label>
          <select id="settingGuessTime" style="font-size:12px">
            <option value="30">30s</option>
            <option value="60" selected>60s</option>
            <option value="90">90s</option>
            <option value="120">120s</option>
          </select>
        </div>
        <div class="input-group" style="margin-bottom:0">
          <label>Rounds</label>
          <select id="settingRounds" style="font-size:12px">
            <option value="1" selected>1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
        </div>
      </div>

      <div style="display:flex;gap:10px;margin-top:8px">
        <button class="btn-secondary" style="flex:1" onclick="showScreen('screenSetup')">← Back</button>
        <button class="btn-primary" style="flex:2" onclick="createRoom()">Create Room →</button>
      </div>
    </div>
  </div>

  <!-- GAME -->
  <div id="screenGame" class="screen">
    <div class="game-layout">
      <!-- SIDEBAR -->
      <div class="card sidebar">
        <div class="card-title" id="sideRoomName" style="font-size:16px;margin-bottom:8px">Room</div>
        <div style="margin-bottom:10px;font-size:12px">
          <strong>Code:</strong> <code id="codeDisplay">-</code>
          <button class="btn-secondary btn-small" style="margin-left:6px;font-size:10px" onclick="copyCode()">Copy</button>
        </div>
        <div class="turn-indicator" id="turnIndicator">Waiting…</div>
        <div id="modeTag" class="info-box info-purple" style="margin-bottom:8px;font-size:11px"></div>
        <div style="font-weight:800;font-size:12px;margin-bottom:3px">Players <span id="playerCount" style="color:#aaa;font-weight:400;font-size:11px"></span></div>
        <div class="players-list" id="playersList"></div>
        <button class="btn-primary btn-full" id="startBtn" onclick="startGame()" disabled style="font-size:12px;padding:10px">Start Game</button>
        <button class="btn-secondary btn-full" onclick="leaveRoom()" style="margin-top:8px;font-size:12px;padding:10px">Leave</button>
      </div>

      <!-- MAIN AREA -->
      <div class="card main-area">
        <div class="turn-indicator" id="gamePhaseLabel" style="font-size:13px">Lobby</div>

        <!-- DRAW -->
        <div id="panelDraw" class="phase-panel active">
          <div class="card-title" style="font-size:15px" id="drawTitle">Your Turn to Draw</div>
          <div class="timer-bar-wrap" id="timerWrapDraw"><div class="timer-bar" id="timerBarDraw"></div></div>
          <div class="timer-text" id="timerTextDraw"></div>
          <div class="prompt-box"><strong id="promptDisplay" style="font-size:13px">Waiting to start…</strong></div>
          <div class="tools-row">
            <input type="color" id="brushColor" class="color-picker" value="#000000">
            <div class="slider-group">
              <label>Size: <span id="sizeVal">5</span>px</label>
              <input type="range" id="brushSize" min="1" max="50" value="5" oninput="sizeVal.textContent=this.value">
            </div>
          </div>
          <div class="tool-buttons">
            <button class="tool-btn active" id="toolDraw" onclick="selectTool('draw')">✏️ Draw</button>
            <button class="tool-btn" id="toolEraser" onclick="selectTool('eraser')">🧹 Erase</button>
            <button class="tool-btn" onclick="clearCanvas()" style="font-size:10px">Clear</button>
            <button class="tool-btn" onclick="undoCanvas()" style="font-size:10px">Undo</button>
          </div>
          <div class="canvas-wrap"><canvas id="drawingCanvas" height="360"></canvas></div>
          <button class="btn-primary btn-full" onclick="submitDrawing()" style="font-size:12px;padding:10px">Submit ✓</button>
        </div>

        <!-- STORY -->
        <div id="panelStory" class="phase-panel">
          <div class="card-title" style="font-size:15px">📖 Story Time</div>
          <div class="timer-bar-wrap" id="timerWrapStory"><div class="timer-bar" id="timerBarStory"></div></div>
          <div class="timer-text" id="timerTextStory"></div>
          <div id="storyChainSoFar" style="margin-bottom:10px;max-height:120px;overflow-y:auto;padding:10px;background:#f9f9f9;border-radius:8px;font-size:12px;color:#555;display:none"></div>
          <div class="prompt-box"><strong id="storyPromptDisplay" style="font-size:12px">Waiting…</strong></div>
          <textarea id="storyInput" class="story-input" placeholder="Write your sentence…" maxlength="250" style="font-size:12px"></textarea>
          <div style="text-align:right;font-size:10px;color:#aaa;margin-top:-6px;margin-bottom:8px"><span id="storyCharCount">0</span>/250</div>
          <button class="btn-primary btn-full" onclick="submitStoryText()" style="font-size:12px;padding:10px">Submit ✓</button>
        </div>

        <!-- GUESS -->
        <div id="panelGuess" class="phase-panel">
          <div class="card-title" style="font-size:15px" id="guessTitle">What is this? 🤔</div>
          <div class="timer-bar-wrap" id="timerWrapGuess"><div class="timer-bar" id="timerBarGuess"></div></div>
          <div class="timer-text" id="timerTextGuess"></div>
          <div class="canvas-wrap"><canvas id="displayCanvas" height="360"></canvas></div>
          <input class="guess-input" id="guessInput" placeholder="Type your guess…" autocomplete="off" style="font-size:12px" onkeydown="if(event.key==='Enter')submitGuess()">
          <button class="btn-primary btn-full" onclick="submitGuess()" style="font-size:12px;padding:10px">Submit ✓</button>
        </div>

        <!-- WAITING -->
        <div id="panelWaiting" class="phase-panel">
          <div class="waiting-panel-inner">
            <div style="font-size:48px;margin-bottom:16px">⏳</div>
            <div class="card-title" id="waitingTitle" style="font-size:16px">Waiting…</div>
            <p style="color:#888;font-size:12px;margin-top:8px" id="waitingSubtitle">Others are still playing.</p>
          </div>
        </div>

        <!-- RESULTS -->
        <div id="panelResults" class="phase-panel">
          <div class="card-title" id="resultsTitle">🎉 Results!</div>
          <div class="chain-display" id="chainContent" style="font-size:12px"></div>
          <button class="btn-secondary btn-full" onclick="leaveRoom()" style="font-size:12px;padding:10px">Play Again 🔄</button>
        </div>
      </div>

      <!-- CHAT -->
      <div class="card chat-panel">
        <div class="card-title" style="font-size:14px;margin-bottom:8px">💬 Chat</div>
        <div class="chat-messages" id="chatMessages"></div>
        <input type="text" id="chatInput" class="chat-input" placeholder="Say something…" maxlength="100" 
          onkeydown="if(event.key==='Enter')sendChat()" style="margin-bottom:6px">
        <button class="btn-secondary" onclick="sendChat()" style="width:100%;font-size:11px;padding:8px">Send</button>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyDdwdbP8tsEGKWW88NR9C3StYMhTmecujM",
  authDomain:"gartic-phone-ea498.firebaseapp.com",
  databaseURL:"https://gartic-phone-ea498-default-rtdb.firebaseio.com",
  projectId:"gartic-phone-ea498",
  storageBucket:"gartic-phone-ea498.firebasestorage.app",
  messagingSenderId:"425033124791",
  appId:"1:425033124791:web:0388821e8eaa37a4673632"
});
const db = firebase.database();

// MODES - Now includes ALL modes
const MODES=[
  {id:'normal',    icon:'📝',name:'NORMAL',          desc:'One player draws, others guess. Classic phone!'},
  {id:'telephone', icon:'☎️',name:'TELEPHONE',        desc:'Draw → guess → draw → guess chain.'},
  {id:'story',     icon:'📖',name:'STORY',            desc:'Write one sentence each to build a story.'},
  {id:'knockoff',  icon:'🃏',name:'KNOCK-OFF',        desc:'Everyone draws the SAME prompt. Compare!'},
  {id:'animation', icon:'🎬',name:'ANIMATION',        desc:'Draw 3 frames for a mini flipbook!'},
  {id:'icebreaker',icon:'🧊',name:'ICEBREAKER',       desc:'Warm-up game with fun questions.'},
  {id:'exquisite', icon:'🎭',name:'EXQUISITE CORPSE', desc:'Draw one body part, hide from others.'},
  {id:'masterpiece',icon:'🖼️',name:'MASTERPIECE',     desc:'Recreate famous paintings from memory!'},
  {id:'secret',    icon:'🕵️',name:'SECRET',           desc:'Only one player knows the prompt!'},
  {id:'score',     icon:'🏆',name:'SCORE',            desc:'Everyone draws same thing, vote best!'},
];
let selectedMode='normal';

// Game state
const gs={
  playerName:'',playerId:null,roomId:null,roomName:'',
  isHost:false,players:{},mode:'normal',
  drawTime:90,guessTime:60,rounds:1,
  currentTool:'draw',mouseDown:false,lastX:0,lastY:0,
  undoStack:[],chain:[],
  pendingDrawing:null,storySegments:[],
  currentDrawerIdx:0,currentTurn:0,
  scores:{},myRating:0,
  animationFrames:[],
  listeners:[],timers:[],
  gameState:{},
  chatMessages:[],
};

document.addEventListener('DOMContentLoaded',()=>{
  setStatus('green','✓ Firebase connected!');
  document.getElementById('roomCode').addEventListener('input',function(){this.value=this.value.toUpperCase();});
  document.getElementById('storyInput').addEventListener('input',function(){
    document.getElementById('storyCharCount').textContent=this.value.length;
  });
  document.getElementById('chatInput').addEventListener('input',filterBadWords);
  buildModeGrid();
});

// MODE GRID
function buildModeGrid(){
  document.getElementById('modesGrid').innerHTML=MODES.map(m=>`
    <div class="mode-card${m.id==='normal'?' selected':''}" id="mc_${m.id}" onclick="selectMode('${m.id}')">
      <div class="mode-icon">${m.icon}</div>
      <div class="mode-name">${m.name}</div>
    </div>`).join('');
  selectMode('normal');
}

function selectMode(id){
  selectedMode=id;
  document.querySelectorAll('.mode-card').forEach(c=>c.classList.remove('selected'));
  document.getElementById('mc_'+id).classList.add('selected');
  const m=MODES.find(x=>x.id===id);
  document.getElementById('modeDesc').innerHTML=m.icon+' '+m.desc;
}

function goModeSelect(){
  if(!document.getElementById('playerName').value.trim()){alert('Enter your name.');return;}
  showScreen('screenMode');
}

// ROOM CREATION
function createRoom(){
  const name=document.getElementById('playerName').value.trim();
  if(!name){alert('Enter your name.');return;}
  gs.playerName=name;
  gs.playerId='p_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
  gs.roomId=Math.random().toString(36).substring(2,8).toUpperCase();
  gs.roomName=document.getElementById('roomName').value.trim()||'Fun Room';
  gs.isHost=true;
  gs.mode=selectedMode;
  gs.drawTime=parseInt(document.getElementById('settingDrawTime').value);
  gs.guessTime=parseInt(document.getElementById('settingGuessTime').value);
  gs.rounds=parseInt(document.getElementById('settingRounds').value);
  const maxPlayers=Math.min(8,Math.max(2,parseInt(document.getElementById('maxPlayers').value)||4));
  db.ref('rooms/'+gs.roomId).set({
    name:gs.roomName,maxPlayers,host:gs.playerId,phase:'lobby',mode:gs.mode,
    drawTime:gs.drawTime,guessTime:gs.guessTime,rounds:gs.rounds,createdAt:firebase.database.ServerValue.TIMESTAMP,
    players:{[gs.playerId]:{name:gs.playerName,isHost:true,status:'joined'}},
    gameState:{}
  }).then(enterRoom).catch(e=>alert('Error: '+e.message));
}

function joinRoom(){
  const name=document.getElementById('joinPlayerName').value.trim();
  const code=document.getElementById('roomCode').value.trim().toUpperCase();
  if(!name){alert('Enter your name.');return;}
  if(!code){alert('Enter room code.');return;}
  gs.playerName=name;
  gs.playerId='p_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
  gs.roomId=code;gs.isHost=false;
  db.ref('rooms/'+code).once('value').then(snap=>{
    const room=snap.val();
    if(!room){alert('Room not found.');return;}
    if(room.phase!=='lobby'){alert('Game started.');return;}
    if(Object.keys(room.players||{}).length>=room.maxPlayers){alert('Room full!');return;}
    gs.roomName=room.name;gs.mode=room.mode||'normal';
    gs.drawTime=room.drawTime||90;gs.guessTime=room.guessTime||60;gs.rounds=room.rounds||1;
    db.ref('rooms/'+code+'/players/'+gs.playerId)
      .set({name:gs.playerName,isHost:false,status:'joined'})
      .then(enterRoom).catch(e=>alert('Error: '+e.message));
  }).catch(e=>alert('Error: '+e.message));
}

function enterRoom(){
  document.getElementById('sideRoomName').textContent=gs.roomName;
  document.getElementById('codeDisplay').textContent=gs.roomId;
  const mi=MODES.find(m=>m.id===gs.mode)||MODES[0];
  document.getElementById('modeTag').innerHTML=mi.icon+' <strong>'+mi.name+'</strong>';
  showScreen('screenGame');
  setTimeout(initCanvas,150);
  attachListeners();
  db.ref('rooms/'+gs.roomId+'/players/'+gs.playerId).onDisconnect().remove();
}

// LISTENERS
function attachListeners(){
  function reg(ref){gs.listeners.push(ref);return ref;}
  reg(db.ref('rooms/'+gs.roomId+'/players')).on('value',snap=>{
    gs.players=snap.val()||{};renderPlayers();
    // Host reassignment on disconnect
    if(gs.isHost&&!gs.players[gs.playerId]){
      gs.isHost=false;
    }
  });
  reg(db.ref('rooms/'+gs.roomId+'/phase')).on('value',snap=>handlePhaseChange(snap.val()));
  reg(db.ref('rooms/'+gs.roomId+'/gameState')).on('value',snap=>gs.gameState=snap.val()||{});
  reg(db.ref('rooms/'+gs.roomId+'/currentPrompt')).on('value',snap=>{
    if(snap.val()){
      document.getElementById('promptDisplay').textContent=snap.val();
      document.getElementById('storyPromptDisplay').textContent=snap.val();
    }
  });
  reg(db.ref('rooms/'+gs.roomId+'/currentDrawing')).on('value',snap=>{
    if(snap.val()){gs.pendingDrawing=snap.val();renderDisplayCanvas(snap.val());}
  });
  reg(db.ref('rooms/'+gs.roomId+'/chat')).on('child_added',snap=>{
    const msg=snap.val();
    gs.chatMessages.push(msg);
    renderChat();
  });
  reg(db.ref('rooms/'+gs.roomId+'/storySegments')).on('value',snap=>gs.storySegments=snap.val()||[]);
}

function detachListeners(){gs.listeners.forEach(r=>r.off());gs.listeners=[];}

// PLAYERS
function renderPlayers(){
  const entries=Object.entries(gs.players);
  document.getElementById('playerCount').textContent='('+entries.length+')';
  document.getElementById('playersList').innerHTML=entries.length===0
    ?'<div class="player-item"><span style="color:#aaa;font-size:11px">Waiting…</span></div>'
    :entries.map(([id,p])=>`
      <div class="player-item">
        <span style="font-size:11px">${esc(p.name)}${id===gs.playerId?' (you)':''}</span>
        <span class="badge ${p.isHost?'badge-host':p.status==='done'?'badge-done':'badge-ready'}">
          ${p.isHost?'👑':p.status==='done'?'✓':''}
        </span>
      </div>`).join('');
  const n=entries.length;
  document.getElementById('startBtn').disabled=!(gs.isHost&&n>=2);
  document.getElementById('turnIndicator').textContent=n+' player'+(n>1?'s':'')+' ready';
}

// PROMPTS
const P_NORMAL=['Cat on bike','Haunted pizza','Dinosaur dentist','Robot eating spaghetti','Fish guitar','Astronaut shopping'];
const P_ICE=['Breakfast today?','Your spirit animal','Current mood','Biggest fear'];
const P_MASTER=['Starry Night','Mona Lisa','The Scream','American Gothic'];
const P_SECRET=['Eiffel Tower','Pizza','Dinosaur','Internet'];
function rand(a){return a[Math.floor(Math.random()*a.length)];}

// START GAME
function startGame(){
  if(!gs.isHost)return;
  const n=Object.keys(gs.players).length;
  if(n<2){alert('Need 2+ players!');return;}
  let prompt='';
  switch(gs.mode){
    case 'story': prompt=''; break;
    case 'icebreaker': prompt=rand(P_ICE); break;
    case 'telephone': prompt=rand(P_NORMAL); break;
    case 'masterpiece': prompt='Recreate: '+rand(P_MASTER); break;
    case 'secret': prompt=rand(P_SECRET); break;
    default: prompt=rand(P_NORMAL);
  }
  const playerIds=Object.keys(gs.players);
  const updates={
    phase:'draw',currentPrompt:prompt,currentDrawing:null,
    currentDrawerIdx:0,scores:{},storySegments:[],drawings:{},
    animationFrames:{},playerOrder:playerIds,gameState:{round:0}
  };
  playerIds.forEach(pid=>{updates['players/'+pid+'/status']='ready';});
  db.ref('rooms/'+gs.roomId).update(updates);
}

// PHASE HANDLER
function handlePhaseChange(phase){
  if(!phase)return;
  stopAllTimers();

  if(phase==='lobby'){
    showPanel('draw');
    document.getElementById('gamePhaseLabel').textContent='🏠 Lobby';
  } else if(phase==='draw'){
    document.getElementById('gamePhaseLabel').textContent='✏️ Draw';
    const playerOrder=gs.gameState.playerOrder||Object.keys(gs.players);
    const drawerIdx=gs.gameState.currentDrawerIdx||0;
    const isMyTurn=playerOrder[drawerIdx]===gs.playerId;

    if(gs.mode==='story'){
      const segCount=Array.isArray(gs.storySegments)?gs.storySegments.length:0;
      document.getElementById('storyPromptDisplay').textContent=segCount===0?'Start the story!':'Continue the story!';
      document.getElementById('storyInput').value='';
      document.getElementById('storyCharCount').textContent='0';
      showPanel('story');
      if(gs.drawTime>0) startTimer(gs.drawTime,'timerBarStory','timerWrapStory','timerTextStory',()=>submitStoryText(true));
      return;
    }

    if(gs.mode==='normal'){
      if(isMyTurn){
        document.getElementById('drawTitle').textContent='Your Turn!';
        showPanel('draw');
        clearCanvas();
        if(gs.drawTime>0) startTimer(gs.drawTime,'timerBarDraw','timerWrapDraw','timerTextDraw',()=>submitDrawing(true));
      } else {
        showPanel('waiting');
        document.getElementById('waitingTitle').textContent=esc(gs.players[playerOrder[drawerIdx]].name)+' is drawing…';
      }
      return;
    }

    if(['telephone','exquisite','animation'].includes(gs.mode)){
      const segCount=Array.isArray(gs.storySegments)?gs.storySegments.length:0;
      if(isMyTurn){
        if(gs.mode==='animation'){
          document.getElementById('drawTitle').textContent='Frame '+(gs.animationFrames.length+1)+'/3';
        }
        showPanel('draw');
        clearCanvas();
        if(gs.drawTime>0) startTimer(gs.drawTime,'timerBarDraw','timerWrapDraw','timerTextDraw',()=>submitDrawing(true));
      } else {
        showPanel('waiting');
      }
      return;
    }

    showPanel('draw');
    clearCanvas();
    if(gs.drawTime>0) startTimer(gs.drawTime,'timerBarDraw','timerWrapDraw','timerTextDraw',()=>submitDrawing(true));

  } else if(phase==='guess'){
    document.getElementById('gamePhaseLabel').textContent='🤔 Guess';
    const playerOrder=gs.gameState.playerOrder||Object.keys(gs.players);
    const drawerIdx=gs.gameState.currentDrawerIdx||0;
    const isDrawer=playerOrder[drawerIdx]===gs.playerId;

    if(isDrawer){
      showPanel('waiting');
      document.getElementById('waitingTitle').textContent='Others are guessing…';
    } else {
      showPanel('guess');
      if(gs.guessTime>0) startTimer(gs.guessTime,'timerBarGuess','timerWrapGuess','timerTextGuess',()=>submitGuess(true));
    }

  } else if(phase==='done'){
    buildResults();
  }
}

// CANVAS
let canvas,ctx,dispCanvas,dispCtx;

function initCanvas(){
  canvas=document.getElementById('drawingCanvas');
  ctx=canvas.getContext('2d');
  dispCanvas=document.getElementById('displayCanvas');
  dispCtx=dispCanvas.getContext('2d');

  function setDim(c,h){
    const w=c.parentElement?c.parentElement.clientWidth:700;
    c.width=Math.max(300,w);c.height=h||360;
  }
  setDim(canvas,360);setDim(dispCanvas,360);

  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);

  canvas.addEventListener('mousedown',e=>{gs.mouseDown=true;setLast(e);saveUndo();},{passive:true});
  canvas.addEventListener('mousemove',doDraw,{passive:true});
  canvas.addEventListener('mouseup',()=>gs.mouseDown=false);
  canvas.addEventListener('mouseleave',()=>gs.mouseDown=false);
  canvas.addEventListener('touchstart',e=>{gs.mouseDown=true;setLast(e.touches[0]);saveUndo();},{passive:true});
  canvas.addEventListener('touchmove',doDraw,{passive:true});
  canvas.addEventListener('touchend',()=>gs.mouseDown=false);
}

function setLast(e){
  const r=canvas.getBoundingClientRect();
  gs.lastX=e.clientX-r.left;gs.lastY=e.clientY-r.top;
}

function doDraw(e){
  if(!gs.mouseDown||!canvas)return;
  const r=canvas.getBoundingClientRect();
  const x=e.clientX-r.left,y=e.clientY-r.top;
  if(gs.currentTool==='eraser'){
    const s=parseInt(document.getElementById('brushSize').value)*2;
    ctx.clearRect(x-s/2,y-s/2,s,s);
  } else {
    ctx.strokeStyle=document.getElementById('brushColor').value;
    ctx.lineWidth=document.getElementById('brushSize').value;
    ctx.lineCap=ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(gs.lastX,gs.lastY);ctx.lineTo(x,y);ctx.stroke();
  }
  gs.lastX=x;gs.lastY=y;
}

function selectTool(t){
  gs.currentTool=t;
  document.getElementById('toolDraw').classList.toggle('active',t==='draw');
  document.getElementById('toolEraser').classList.toggle('active',t==='eraser');
}

function clearCanvas(){
  if(!ctx)return;
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);
  saveUndo();
}

function saveUndo(){
  if(gs.undoStack.length>12)gs.undoStack.shift();
  gs.undoStack.push(ctx.getImageData(0,0,canvas.width,canvas.height));
}

function undoCanvas(){
  if(gs.undoStack.length>1){
    gs.undoStack.pop();
    ctx.putImageData(gs.undoStack[gs.undoStack.length-1],0,0);
  }
}

function exportCanvas(){
  const exp=document.createElement('canvas');
  exp.width=canvas.width;exp.height=canvas.height;
  const ectx=exp.getContext('2d');
  ectx.fillStyle='#ffffff';ectx.fillRect(0,0,exp.width,exp.height);
  ectx.drawImage(canvas,0,0);
  return exp.toDataURL('image/jpeg',0.85);
}

function renderDisplayCanvas(dataUrl){
  if(!dispCanvas)return;
  const w=dispCanvas.parentElement?dispCanvas.parentElement.clientWidth:700;
  dispCanvas.width=w;dispCanvas.height=360;
  const img=new Image();
  img.onload=()=>{dispCtx.drawImage(img,0,0,dispCanvas.width,dispCanvas.height);};
  img.onerror=()=>console.error('Image failed');
  img.src=dataUrl;
}

// TIMERS
function startTimer(secs,barId,wrapId,textId,onEnd){
  const wrap=document.getElementById(wrapId);
  const bar=document.getElementById(barId);
  const txt=document.getElementById(textId);
  if(wrap)wrap.style.display='block';
  if(bar)bar.style.width='100%';
  let left=secs;
  const iv=setInterval(()=>{
    left--;
    if(bar)bar.style.width=Math.max(0,left/secs*100)+'%';
    if(txt)txt.textContent=left+'s';
    if(left<=0){clearInterval(iv);if(onEnd)onEnd();}
  },1000);
  gs.timers.push(iv);
}

function stopAllTimers(){
  gs.timers.forEach(clearInterval);gs.timers=[];
  ['timerWrapDraw','timerWrapGuess','timerWrapStory'].forEach(id=>{
    const el=document.getElementById(id);if(el)el.style.display='none';
  });
}

// SUBMISSIONS
function submitDrawing(auto){
  stopAllTimers();
  const dataUrl=exportCanvas();
  gs.chain.push({type:'drawing',player:gs.playerName,content:dataUrl});
  db.ref('rooms/'+gs.roomId+'/players/'+gs.playerId+'/status').set('done');

  if(['knockoff','score'].includes(gs.mode)){
    db.ref('rooms/'+gs.roomId+'/drawings/'+gs.playerId).set({player:gs.playerName,data:dataUrl});
    showPanel('waiting');
    if(gs.isHost) watchForAllDone(()=>db.ref('rooms/'+gs.roomId).update({phase:'done'}));

  } else if(gs.mode==='telephone'){
    const newSegs=[...gs.storySegments,{type:'drawing',player:gs.playerName,content:dataUrl}];
    db.ref('rooms/'+gs.roomId+'/storySegments').set(newSegs);
    showPanel('waiting');
    if(gs.isHost) transitionTelephonePhase(newSegs);

  } else if(gs.mode==='normal'){
    db.ref('rooms/'+gs.roomId).update({phase:'guess',currentDrawing:dataUrl});
    showPanel('waiting');

  } else if(gs.mode==='animation'){
    gs.animationFrames.push(dataUrl);
    if(gs.animationFrames.length<3){
      document.getElementById('drawTitle').textContent='Frame '+(gs.animationFrames.length+1)+'/3';
      clearCanvas();
      if(gs.drawTime>0) startTimer(gs.drawTime,'timerBarDraw','timerWrapDraw','timerTextDraw',()=>submitDrawing(true));
    } else {
      db.ref('rooms/'+gs.roomId).update({phase:'guess',currentDrawing:gs.animationFrames[0]});
      showPanel('waiting');
    }

  } else {
    db.ref('rooms/'+gs.roomId).update({phase:'guess',currentDrawing:dataUrl});
    showPanel('waiting');
  }
}

function submitStoryText(auto){
  stopAllTimers();
  const text=document.getElementById('storyInput').value.trim()||'(skipped)';
  const newSegs=[...gs.storySegments,{type:'text',player:gs.playerName,content:text}];
  gs.chain.push({type:'text',player:gs.playerName,content:text});
  db.ref('rooms/'+gs.roomId+'/storySegments').set(newSegs);
  db.ref('rooms/'+gs.roomId+'/players/'+gs.playerId+'/status').set('done');
  showPanel('waiting');

  if(gs.isHost){
    const totalPlayers=Object.keys(gs.players).length;
    setTimeout(()=>{
      if(newSegs.length>=totalPlayers){
        db.ref('rooms/'+gs.roomId).update({phase:'done'});
      } else {
        db.ref('rooms/'+gs.roomId).update({phase:'draw',currentPrompt:'Next player!'});
      }
    },600);
  }
}

function submitGuess(auto){
  stopAllTimers();
  const guess=document.getElementById('guessInput').value.trim()||(auto?'(no answer)':'');
  if(!guess&&!auto)return;
  gs.chain.push({type:'guess',player:gs.playerName,content:guess});
  document.getElementById('guessInput').value='';
  db.ref('rooms/'+gs.roomId+'/players/'+gs.playerId+'/status').set('done');
  showPanel('waiting');

  if(gs.mode==='telephone'&&gs.isHost){
    const newSegs=[...gs.storySegments,{type:'guess',player:gs.playerName,content:guess}];
    db.ref('rooms/'+gs.roomId+'/storySegments').set(newSegs);
    transitionTelephonePhase(newSegs);
    return;
  }

  if(gs.mode==='normal'&&gs.isHost){
    watchForAllDone(()=>{
      const playerOrder=gs.gameState.playerOrder||Object.keys(gs.players);
      const nextIdx=(gs.gameState.currentDrawerIdx||0)+1;
      if(nextIdx>=playerOrder.length){
        db.ref('rooms/'+gs.roomId).update({phase:'done'});
      } else {
        db.ref('rooms/'+gs.roomId).update({phase:'draw','gameState/currentDrawerIdx':nextIdx});
      }
    });
  }
}

function transitionTelephonePhase(segs){
  const totalPlayers=Object.keys(gs.players).length;
  const maxSegs=totalPlayers*2;
  setTimeout(()=>{
    if(segs.length>=maxSegs){
      db.ref('rooms/'+gs.roomId).update({phase:'done'});
    } else {
      const nextPrompt=segs[segs.length-1].content;
      db.ref('rooms/'+gs.roomId).update({
        phase:'draw',
        currentPrompt:'Draw: "'+nextPrompt+'"'
      });
    }
  },400);
}

function watchForAllDone(cb){
  if(!gs.isHost)return;
  const check=()=>{
    db.ref('rooms/'+gs.roomId+'/players').once('value').then(snap=>{
      const allDone=Object.values(snap.val()||{}).every(p=>p.status==='done');
      if(allDone)cb();else setTimeout(check,800);
    });
  };
  setTimeout(check,400);
}

// CHAT
function sendChat(){
  const input=document.getElementById('chatInput');
  const msg=input.value.trim();
  if(!msg||msg.length>100)return;
  const filtered=filterProfanity(msg);
  db.ref('rooms/'+gs.roomId+'/chat').push({
    player:gs.playerName,text:filtered,time:Date.now()
  });
  input.value='';
}

const badWords=['badword1','badword2','inappropriate'];
function filterProfanity(text){
  let result=text;
  badWords.forEach(word=>{
    const regex=new RegExp(word,'gi');
    result=result.replace(regex,'*'.repeat(word.length));
  });
  return result;
}

function filterBadWords(){
  const input=document.getElementById('chatInput');
  input.value=filterProfanity(input.value);
}

function renderChat(){
  const container=document.getElementById('chatMessages');
  const recentMsgs=gs.chatMessages.slice(-20);
  container.innerHTML=recentMsgs.map(m=>`
    <div class="chat-msg">
      <strong>${esc(m.player)}:</strong> ${esc(m.text)}
    </div>`).join('');
  container.scrollTop=container.scrollHeight;
}

// RESULTS
function buildResults(){
  stopAllTimers();
  showPanel('results');
  document.getElementById('gamePhaseLabel').textContent='🎉 Results!';
  
  const chainEl=document.getElementById('chainContent');
  const segs=Array.isArray(gs.storySegments)?gs.storySegments:[];

  if(gs.mode==='story'&&segs.length>0){
    const textSegs=segs.filter(s=>s.type==='text');
    chainEl.innerHTML='<div style="font-size:14px;line-height:1.8;color:var(--dark);font-style:italic">'+
      textSegs.map(s=>s.content).join(' ')+
      '</div>';
  } else if(gs.mode==='telephone'&&segs.length>0){
    chainEl.innerHTML=segs.map((item,i)=>
      item.type==='drawing'
        ?`<div class="chain-item"><div class="chain-player">${i+1}. ${esc(item.player)} drew:</div><img src="${item.content}" class="chain-image"></div>`
        :`<div class="chain-item"><div class="chain-player">${i+1}. ${esc(item.player)} guessed:</div><div class="chain-content">"${esc(item.content)}"</div></div>`
    ).join('');
  } else if(['knockoff','score'].includes(gs.mode)){
    chainEl.style.display='none';
    document.getElementById('knockoffGrid').style.display='block';
  } else {
    chainEl.innerHTML=gs.chain.length>0
      ?gs.chain.map((item,i)=>
          item.type==='drawing'
            ?`<div class="chain-item"><div class="chain-player">${i+1}. ${esc(item.player)}</div><img src="${item.content}" class="chain-image"></div>`
            :`<div class="chain-item"><div class="chain-player">${i+1}. ${esc(item.player)}</div><div class="chain-content">"${esc(item.content)}"</div></div>`
        ).join(''):
      'Play to see results!';
  }
}

// UI
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showPanel(name){
  const panels=['panelDraw','panelStory','panelGuess','panelWaiting','panelResults'];
  panels.forEach(id=>document.getElementById(id).classList.remove('active'));
  const map={draw:'panelDraw',story:'panelStory',guess:'panelGuess',waiting:'panelWaiting',results:'panelResults'};
  if(map[name])document.getElementById(map[name]).classList.add('active');
}

function switchTab(tab){
  document.getElementById('createTab').style.display=tab==='create'?'block':'none';
  document.getElementById('joinTab').style.display=tab==='join'?'block':'none';
  document.getElementById('tabCreate').classList.toggle('active',tab==='create');
  document.getElementById('tabJoin').classList.toggle('active',tab==='join');
}

function setStatus(color,html){
  const el=document.getElementById('firebaseStatus');
  el.className='info-box info-'+color;el.innerHTML=html;
}

function copyCode(){navigator.clipboard.writeText(gs.roomId);}

function leaveRoom(){
  stopAllTimers();detachListeners();
  if(gs.playerId&&gs.roomId)db.ref('rooms/'+gs.roomId+'/players/'+gs.playerId).remove();
  Object.assign(gs,{playerName:'',playerId:null,roomId:null,players:{},chain:[],storySegments:[],animationFrames:[]});
  showScreen('screenSetup');showPanel('draw');
  ['playerName','roomName','joinPlayerName','roomCode','guessInput','storyInput','chatInput'].forEach(id=>{
    const el=document.getElementById(id);if(el)el.value='';
  });
  if(ctx)clearCanvas();
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
