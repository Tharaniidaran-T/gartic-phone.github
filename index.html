<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gartic Phone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #ff6b6b;
            --secondary: #4ecdc4;
            --accent: #ffe66d;
            --dark: #1a1a2e;
            --border-radius: 16px;
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.15);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px; color: var(--dark);
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 40px; }
        .logo {
            font-size: 48px; font-weight: 900;
            background: linear-gradient(135deg, #ff6b6b, #ffe66d, #4ecdc4);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; margin-bottom: 10px; letter-spacing: -2px;
        }
        .tagline { color: white; font-size: 16px; font-weight: 500; opacity: 0.9; }
        .main-content { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 30px; }
        .card { background: white; border-radius: var(--border-radius); padding: 30px; box-shadow: var(--shadow-lg); }
        .card-title { font-size: 24px; font-weight: 700; margin-bottom: 20px; color: var(--dark); }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        .input-group input {
            width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0;
            border-radius: 8px; font-size: 14px; transition: all 0.3s; font-family: inherit;
        }
        .input-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,107,0.1); }
        button {
            padding: 14px 24px; border: none; border-radius: 8px;
            font-weight: 600; font-size: 14px; cursor: pointer;
            transition: all 0.3s; font-family: inherit; text-transform: uppercase; letter-spacing: 1px;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), #ff5252); color: white; box-shadow: 0 4px 16px rgba(255,107,107,0.3); }
        .btn-primary:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,107,107,0.4); }
        .btn-secondary { background: linear-gradient(135deg, var(--secondary), #45b8aa); color: white; box-shadow: 0 4px 16px rgba(78,205,196,0.3); }
        .btn-secondary:not(:disabled):hover { transform: translateY(-2px); }
        .btn-small { padding: 8px 14px; font-size: 12px; }
        .players-list { margin-top: 12px; padding: 16px; background: #f9f9f9; border-radius: 8px; max-height: 220px; overflow-y: auto; }
        .player-item { padding: 10px 12px; background: white; border-radius: 6px; margin-bottom: 8px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
        .player-item:last-child { margin-bottom: 0; }
        .badge { font-size: 11px; padding: 3px 8px; border-radius: 20px; font-weight: 600; }
        .badge-host { background: #fff3cd; color: #856404; }
        .badge-ready { background: #d1f7e0; color: #166534; }
        .canvas-section { grid-column: 2; }
        .canvas-container { margin-bottom: 16px; border-radius: 8px; overflow: hidden; box-shadow: inset 0 0 0 2px #e0e0e0; }
        canvas { display: block; background: white; cursor: crosshair; width: 100%; }
        .tools { display: grid; grid-template-columns: auto 1fr 1fr; gap: 12px; margin-bottom: 12px; align-items: center; }
        .color-picker { width: 48px; height: 48px; border: none; border-radius: 8px; cursor: pointer; }
        .slider-group { display: flex; flex-direction: column; gap: 4px; }
        .slider-group label { font-size: 12px; font-weight: 600; color: #666; }
        input[type="range"] { cursor: pointer; width: 100%; }
        .tool-buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .tool-btn { padding: 10px; background: #f0f0f0; border: 2px solid transparent; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s; text-transform: none; letter-spacing: 0; }
        .tool-btn.active { background: var(--accent); border-color: var(--primary); }
        .tool-btn:hover:not(.active) { background: #e0e0e0; }
        .state-section { grid-column: 1 / -1; display: none; }
        .state-section.active { display: block; }
        .phase-inner { display: none; }
        .phase-inner.active { display: block; }
        .guess-input { width: 100%; padding: 14px 16px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; margin-bottom: 12px; font-family: inherit; }
        .guess-input:focus { outline: none; border-color: var(--secondary); }
        .chain-display { background: #f9f9f9; border-radius: 8px; padding: 20px; margin-bottom: 20px; max-height: 450px; overflow-y: auto; }
        .chain-item { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #e0e0e0; }
        .chain-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .chain-player { font-weight: 700; color: var(--primary); font-size: 12px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .chain-content { font-size: 15px; color: var(--dark); font-style: italic; }
        .chain-image { width: 100%; border-radius: 6px; margin-top: 8px; border: 1px solid #e0e0e0; }
        .setup-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .tab-btn { padding: 14px; background: #f0f0f0; border: 2px solid transparent; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.3s; text-transform: none; letter-spacing: 0; font-size: 15px; }
        .tab-btn.active { background: linear-gradient(135deg, var(--primary), #ff5252); color: white; }
        .turn-indicator { padding: 14px 16px; background: linear-gradient(135deg, var(--accent), #ffd54f); border-radius: 8px; margin-bottom: 16px; font-weight: 700; text-align: center; color: var(--dark); }
        .info-box { padding: 14px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; border-left: 4px solid; }
        .info-blue { background: #e3f2fd; border-color: #2196f3; color: #0d47a1; }
        .info-green { background: #e8f5e9; border-color: #4caf50; color: #2e7d32; }
        .info-orange { background: #fff3e0; border-color: #ff9800; color: #e65100; }
        #startBtn { width: 100%; margin-top: 20px; }
        #leaveBtn { width: 100%; margin-top: 12px; }
        code { background: #f0f0f0; padding: 3px 8px; border-radius: 4px; font-size: 14px; letter-spacing: 2px; }
        @media (max-width: 768px) {
            .main-content { grid-template-columns: 1fr; }
            .canvas-section { grid-column: 1; }
            .logo { font-size: 32px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">Gartic Phone</div>
        <div class="tagline">Draw it. Guess it. Share the chaos.</div>
    </div>

    <div class="main-content">

        <!-- SETUP -->
        <div id="setupState" class="state-section active">
            <div class="card" style="max-width:500px;margin:0 auto;">
                <div class="card-title">Welcome to Gartic Phone</div>
                <div id="firebaseStatus" class="info-box info-blue">⏳ Connecting to Firebase...</div>
                <div class="setup-tabs">
                    <button class="tab-btn active" id="tabCreate" onclick="switchTab('create')">Create Room</button>
                    <button class="tab-btn" id="tabJoin" onclick="switchTab('join')">Join Room</button>
                </div>

                <!-- Create -->
                <div id="createTab">
                    <div class="input-group">
                        <label>Your Name</label>
                        <input type="text" id="playerName" placeholder="Enter your name" maxlength="20">
                    </div>
                    <div class="input-group">
                        <label>Room Name</label>
                        <input type="text" id="roomName" placeholder="Give your room a fun name" maxlength="30">
                    </div>
                    <div class="input-group">
                        <label>Max Players (2–8)</label>
                        <input type="number" id="maxPlayers" min="2" max="8" value="4">
                    </div>
                    <button class="btn-primary" style="width:100%;" onclick="createRoom()">Create Room</button>
                </div>

                <!-- Join -->
                <div id="joinTab" style="display:none;">
                    <div class="input-group">
                        <label>Your Name</label>
                        <input type="text" id="joinPlayerName" placeholder="Enter your name" maxlength="20">
                    </div>
                    <div class="input-group">
                        <label>Room Code</label>
                        <input type="text" id="roomCode" placeholder="6-character code" maxlength="6" style="text-transform:uppercase;">
                    </div>
                    <button class="btn-primary" style="width:100%;" onclick="joinRoom()">Join Room</button>
                </div>
            </div>
        </div>

        <!-- GAME -->
        <div id="gameState" class="state-section">

            <!-- Lobby / player list -->
            <div class="card" style="grid-column:1;">
                <div class="card-title">Room: <span id="roomDisplay">-</span></div>
                <div style="margin-bottom:16px;">
                    <strong>Code:</strong> <code id="codeDisplay">-</code>
                    <button class="btn-secondary btn-small" style="margin-left:10px;" onclick="copyCode()">Copy</button>
                </div>
                <div class="turn-indicator" id="turnIndicator">Waiting for players...</div>
                <div id="minPlayerNote" class="info-box info-orange" style="display:none;">⚠️ Need at least 2 players to start.</div>

                <div style="font-weight:700;font-size:15px;margin-bottom:4px;">Players <span id="playerCount" style="color:#999;font-weight:400;font-size:13px;"></span></div>
                <div class="players-list" id="playersList"></div>

                <button class="btn-primary" id="startBtn" onclick="startGame()" disabled>Start Game</button>
                <button class="btn-secondary" id="leaveBtn" onclick="leaveRoom()">Leave Room</button>
            </div>

            <!-- Draw / Guess / Chain -->
            <div class="card" style="grid-column:2;">
                <div class="turn-indicator" id="gamePhase">Lobby</div>

                <!-- Draw phase -->
                <div id="drawPhase" class="phase-inner active">
                    <div class="card-title" style="font-size:18px;">Your Turn to Draw</div>
                    <div style="padding:12px;background:#fff3cd;border-radius:8px;border-left:4px solid var(--accent);margin-bottom:14px;">
                        <strong id="promptDisplay">Waiting to start...</strong>
                    </div>
                    <div class="tools">
                        <input type="color" id="brushColor" class="color-picker" value="#000000" title="Color">
                        <div class="slider-group">
                            <label>Brush Size: <span id="sizeVal">5</span></label>
                            <input type="range" id="brushSize" min="1" max="50" value="5" oninput="document.getElementById('sizeVal').textContent=this.value">
                        </div>
                        <div class="slider-group">
                            <label>Opacity: <span id="opacVal">100</span>%</label>
                            <input type="range" id="brushOpacity" min="0.05" max="1" step="0.05" value="1" oninput="document.getElementById('opacVal').textContent=Math.round(this.value*100)">
                        </div>
                    </div>
                    <div class="tool-buttons">
                        <button class="tool-btn active" id="toolDraw" onclick="selectTool('draw')">🖌️ Draw</button>
                        <button class="tool-btn" id="toolEraser" onclick="selectTool('eraser')">🧹 Eraser</button>
                        <button class="tool-btn" onclick="clearCanvas()">🗑️ Clear</button>
                    </div>
                    <div class="canvas-container">
                        <canvas id="drawingCanvas" height="420"></canvas>
                    </div>
                    <button class="btn-primary" style="width:100%;margin-top:8px;" onclick="submitDrawing()">Submit Drawing ✓</button>
                </div>

                <!-- Guess phase -->
                <div id="guessPhase" class="phase-inner">
                    <div class="card-title" style="font-size:18px;">What is this drawing?</div>
                    <div class="canvas-container">
                        <canvas id="displayCanvas" height="420"></canvas>
                    </div>
                    <input type="text" class="guess-input" id="guessInput" placeholder="Type your guess..." autocomplete="off" onkeydown="if(event.key==='Enter')submitGuess()">
                    <button class="btn-primary" style="width:100%;" onclick="submitGuess()">Submit Guess ✓</button>
                </div>

                <!-- Chain / results -->
                <div id="chainView" class="phase-inner">
                    <div class="card-title">🎉 The Chain!</div>
                    <div class="chain-display" id="chainContent"></div>
                    <button class="btn-secondary" style="width:100%;" onclick="leaveRoom()">Play Again</button>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
// ─── Firebase init ────────────────────────────────────────────────────────────
const firebaseConfig = {
    apiKey: "AIzaSyDdwdbP8tsEGKWW88NR9C3StYMhTmecujM",
    authDomain: "gartic-phone-ea498.firebaseapp.com",
    databaseURL: "https://gartic-phone-ea498-default-rtdb.firebaseio.com",
    projectId: "gartic-phone-ea498",
    storageBucket: "gartic-phone-ea498.firebasestorage.app",
    messagingSenderId: "425033124791",
    appId: "1:425033124791:web:0388821e8eaa37a4673632"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ─── State ────────────────────────────────────────────────────────────────────
const gs = {
    playerName: '',
    playerId: null,
    roomId: null,
    roomName: '',
    isHost: false,
    players: {},        // { id: { name, status, isHost } }
    currentTool: 'draw',
    mouseDown: false,
    lastX: 0, lastY: 0,
    chain: [],
    currentTurn: 0,
    listeners: []       // refs to detach on leave
};

// ─── On load ──────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
    setStatus('green', '✓ Firebase connected! Create or join a room.');
    // roomCode input auto-uppercase
    document.getElementById('roomCode').addEventListener('input', function() {
        this.value = this.value.toUpperCase();
    });
});

function setStatus(color, html) {
    const el = document.getElementById('firebaseStatus');
    el.className = 'info-box info-' + color;
    el.innerHTML = html;
}

// ─── Tab switch ───────────────────────────────────────────────────────────────
function switchTab(tab) {
    document.getElementById('createTab').style.display = tab === 'create' ? 'block' : 'none';
    document.getElementById('joinTab').style.display  = tab === 'join'   ? 'block' : 'none';
    document.getElementById('tabCreate').classList.toggle('active', tab === 'create');
    document.getElementById('tabJoin').classList.toggle('active', tab === 'join');
}

// ─── Create Room ──────────────────────────────────────────────────────────────
function createRoom() {
    const name = document.getElementById('playerName').value.trim();
    if (!name) { alert('Please enter your name.'); return; }

    gs.playerName = name;
    gs.playerId   = 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
    gs.roomId     = Math.random().toString(36).substring(2, 8).toUpperCase();
    gs.roomName   = document.getElementById('roomName').value.trim() || 'Fun Room';
    gs.isHost     = true;

    const maxPlayers = Math.min(8, Math.max(2, parseInt(document.getElementById('maxPlayers').value) || 4));

    const roomData = {
        name: gs.roomName,
        maxPlayers,
        host: gs.playerId,
        phase: 'lobby',
        createdAt: firebase.database.ServerValue.TIMESTAMP,
        players: {
            [gs.playerId]: { name: gs.playerName, isHost: true, status: 'ready' }
        }
    };

    db.ref('rooms/' + gs.roomId).set(roomData)
        .then(() => enterRoom())
        .catch(err => alert('Error creating room: ' + err.message));
}

// ─── Join Room ────────────────────────────────────────────────────────────────
function joinRoom() {
    const name = document.getElementById('joinPlayerName').value.trim();
    const code = document.getElementById('roomCode').value.trim().toUpperCase();
    if (!name) { alert('Please enter your name.'); return; }
    if (!code)  { alert('Please enter a room code.'); return; }

    gs.playerName = name;
    gs.playerId   = 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
    gs.roomId     = code;
    gs.isHost     = false;

    db.ref('rooms/' + code).once('value').then(snap => {
        const room = snap.val();
        if (!room) { alert('Room not found. Check the code.'); return; }
        if (room.phase !== 'lobby') { alert('Game already in progress.'); return; }

        const playerCount = Object.keys(room.players || {}).length;
        if (playerCount >= room.maxPlayers) { alert('Room is full!'); return; }

        gs.roomName = room.name;

        // Write this player into the room
        db.ref('rooms/' + code + '/players/' + gs.playerId)
            .set({ name: gs.playerName, isHost: false, status: 'ready' })
            .then(() => enterRoom())
            .catch(err => alert('Error joining room: ' + err.message));
    }).catch(err => alert('Error: ' + err.message));
}

// ─── Enter room (shared post-create/join) ─────────────────────────────────────
function enterRoom() {
    document.getElementById('roomDisplay').textContent = gs.roomName;
    document.getElementById('codeDisplay').textContent = gs.roomId;
    showState('game');
    initCanvas();
    attachListeners();

    // Remove player on disconnect
    db.ref('rooms/' + gs.roomId + '/players/' + gs.playerId).onDisconnect().remove();
}

// ─── Firebase listeners ───────────────────────────────────────────────────────
function attachListeners() {
    // Players
    const playersRef = db.ref('rooms/' + gs.roomId + '/players');
    playersRef.on('value', snap => {
        gs.players = snap.val() || {};
        renderPlayers();
    });
    gs.listeners.push(playersRef);

    // Phase (so non-host players react to game start)
    const phaseRef = db.ref('rooms/' + gs.roomId + '/phase');
    phaseRef.on('value', snap => {
        const phase = snap.val();
        if (phase === 'draw') {
            document.getElementById('gamePhase').textContent = '✏️ Draw Phase';
            showPhase('draw');
        } else if (phase === 'guess') {
            document.getElementById('gamePhase').textContent = '🤔 Guess Phase';
        } else if (phase === 'done') {
            showChain();
        }
    });
    gs.listeners.push(phaseRef);

    // Prompt (for non-host players)
    const promptRef = db.ref('rooms/' + gs.roomId + '/currentPrompt');
    promptRef.on('value', snap => {
        const p = snap.val();
        if (p) document.getElementById('promptDisplay').textContent = p;
    });
    gs.listeners.push(promptRef);

    // Drawing data (for guessers)
    const drawingRef = db.ref('rooms/' + gs.roomId + '/currentDrawing');
    drawingRef.on('value', snap => {
        const data = snap.val();
        if (data) displayDrawing(data);
    });
    gs.listeners.push(drawingRef);
}

function detachListeners() {
    gs.listeners.forEach(ref => ref.off());
    gs.listeners = [];
}

// ─── Render players list ──────────────────────────────────────────────────────
function renderPlayers() {
    const list = document.getElementById('playersList');
    const entries = Object.entries(gs.players);
    const count = entries.length;

    document.getElementById('playerCount').textContent = '(' + count + ' player' + (count !== 1 ? 's' : '') + ')';

    if (count === 0) {
        list.innerHTML = '<div class="player-item"><span style="color:#999;">Nobody here yet…</span></div>';
    } else {
        list.innerHTML = entries.map(([id, p]) => `
            <div class="player-item">
                <span>${escHtml(p.name)}${id === gs.playerId ? ' <em style="color:#aaa;font-size:12px;">(you)</em>' : ''}</span>
                <span class="badge ${p.isHost ? 'badge-host' : 'badge-ready'}">${p.isHost ? '👑 Host' : '✓ Ready'}</span>
            </div>`).join('');
    }

    // Start button: only host can start, needs ≥2 players
    const canStart = gs.isHost && count >= 2;
    const startBtn = document.getElementById('startBtn');
    startBtn.disabled = !canStart;
    document.getElementById('minPlayerNote').style.display = gs.isHost && count < 2 ? 'block' : 'none';
    document.getElementById('turnIndicator').textContent =
        count < 2 ? 'Waiting for players…' : count + ' player' + (count > 1 ? 's' : '') + ' ready!';
}

// ─── Start game ───────────────────────────────────────────────────────────────
const PROMPTS = [
    'A cat riding a bicycle','A haunted pizza','A dinosaur at the dentist',
    'A robot eating spaghetti','A fish playing guitar','An astronaut grocery shopping',
    'A dog driving a bus','A penguin at the beach','A wizard doing laundry',
    'A bear baking cupcakes','A shark at a birthday party','A snail winning a race'
];

function startGame() {
    if (!gs.isHost) return;
    const count = Object.keys(gs.players).length;
    if (count < 2) { alert('Need at least 2 players!'); return; }

    const prompt = PROMPTS[Math.floor(Math.random() * PROMPTS.length)];
    db.ref('rooms/' + gs.roomId).update({
        phase: 'draw',
        currentPrompt: prompt,
        currentDrawing: null
    });
}

// ─── Canvas ───────────────────────────────────────────────────────────────────
let canvas, ctx, displayCanvas, displayCtx;

function initCanvas() {
    canvas = document.getElementById('drawingCanvas');
    ctx = canvas.getContext('2d');
    displayCanvas = document.getElementById('displayCanvas');
    displayCtx = displayCanvas.getContext('2d');

    function size() {
        const w = canvas.parentElement.clientWidth;
        canvas.width = w; canvas.height = 420;
        displayCanvas.width = w; displayCanvas.height = 420;
    }
    size();
    window.addEventListener('resize', size);

    canvas.addEventListener('mousedown', e => { gs.mouseDown = true; setLast(e); });
    canvas.addEventListener('mousemove', doDraw);
    canvas.addEventListener('mouseup', () => gs.mouseDown = false);
    canvas.addEventListener('mouseleave', () => gs.mouseDown = false);
    canvas.addEventListener('touchstart', e => { e.preventDefault(); gs.mouseDown = true; setLast(e.touches[0]); }, { passive: false });
    canvas.addEventListener('touchmove',  e => { e.preventDefault(); doDraw(e.touches[0]); }, { passive: false });
    canvas.addEventListener('touchend',   () => gs.mouseDown = false);
}

function setLast(e) {
    const r = canvas.getBoundingClientRect();
    gs.lastX = e.clientX - r.left;
    gs.lastY = e.clientY - r.top;
}

function doDraw(e) {
    if (!gs.mouseDown) return;
    const r = canvas.getBoundingClientRect();
    const x = e.clientX - r.left;
    const y = e.clientY - r.top;
    ctx.globalAlpha = parseFloat(document.getElementById('brushOpacity').value);
    if (gs.currentTool === 'eraser') {
        const s = parseInt(document.getElementById('brushSize').value) * 2;
        ctx.clearRect(x - s/2, y - s/2, s, s);
    } else {
        ctx.strokeStyle = document.getElementById('brushColor').value;
        ctx.lineWidth   = document.getElementById('brushSize').value;
        ctx.lineCap = ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(gs.lastX, gs.lastY);
        ctx.lineTo(x, y);
        ctx.stroke();
    }
    gs.lastX = x; gs.lastY = y;
}

function selectTool(tool) {
    gs.currentTool = tool;
    document.getElementById('toolDraw').classList.toggle('active', tool === 'draw');
    document.getElementById('toolEraser').classList.toggle('active', tool === 'eraser');
}

function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

function displayDrawing(dataUrl) {
    const img = new Image();
    img.onload = () => {
        displayCtx.clearRect(0, 0, displayCanvas.width, displayCanvas.height);
        displayCtx.drawImage(img, 0, 0, displayCanvas.width, displayCanvas.height);
    };
    img.src = dataUrl;
}

// ─── Submit drawing ───────────────────────────────────────────────────────────
function submitDrawing() {
    const dataUrl = canvas.toDataURL('image/jpeg', 0.7); // compressed
    gs.chain.push({ type: 'drawing', player: gs.playerName, content: dataUrl });

    db.ref('rooms/' + gs.roomId).update({
        phase: 'guess',
        currentDrawing: dataUrl
    });
    document.getElementById('gamePhase').textContent = '🤔 Guess Phase';
    showPhase('guess');
    document.getElementById('guessInput').focus();
}

// ─── Submit guess ─────────────────────────────────────────────────────────────
function submitGuess() {
    const guess = document.getElementById('guessInput').value.trim();
    if (!guess) return;
    gs.chain.push({ type: 'guess', player: gs.playerName, content: guess });
    document.getElementById('guessInput').value = '';
    gs.currentTurn++;

    const totalPlayers = Object.keys(gs.players).length;
    if (gs.currentTurn >= totalPlayers) {
        db.ref('rooms/' + gs.roomId + '/phase').set('done');
    } else {
        // next round: show draw phase again
        const prompt = 'Continue from: ' + guess;
        db.ref('rooms/' + gs.roomId).update({ phase: 'draw', currentPrompt: prompt, currentDrawing: null });
        clearCanvas();
        document.getElementById('gamePhase').textContent = '✏️ Draw Phase';
        showPhase('draw');
    }
}

// ─── Show chain ───────────────────────────────────────────────────────────────
function showChain() {
    document.getElementById('chainContent').innerHTML = gs.chain.map((item, i) =>
        item.type === 'drawing'
            ? `<div class="chain-item">
                 <div class="chain-player">${i+1}. ${escHtml(item.player)} drew:</div>
                 <img src="${item.content}" class="chain-image" alt="drawing">
               </div>`
            : `<div class="chain-item">
                 <div class="chain-player">${i+1}. ${escHtml(item.player)} guessed:</div>
                 <div class="chain-content">"${escHtml(item.content)}"</div>
               </div>`
    ).join('');
    showPhase('chain');
    document.getElementById('gamePhase').textContent = '🎉 Game Complete!';
}

// ─── UI helpers ───────────────────────────────────────────────────────────────
function showState(state) {
    document.querySelectorAll('.state-section').forEach(s => s.classList.remove('active'));
    document.getElementById(state + 'State').classList.add('active');
}

function showPhase(phase) {
    document.getElementById('drawPhase').classList.toggle('active', phase === 'draw');
    document.getElementById('guessPhase').classList.toggle('active', phase === 'guess');
    document.getElementById('chainView').classList.toggle('active', phase === 'chain');
}

function copyCode() {
    navigator.clipboard.writeText(gs.roomId).then(() => alert('Room code copied!'));
}

function leaveRoom() {
    if (!confirm('Leave the room?')) return;
    detachListeners();
    if (gs.playerId && gs.roomId) {
        db.ref('rooms/' + gs.roomId + '/players/' + gs.playerId).remove();
    }
    Object.assign(gs, { playerName:'', playerId:null, roomId:null, roomName:'', isHost:false, players:{}, chain:[], currentTurn:0, currentTool:'draw', mouseDown:false });
    showState('setup');
    showPhase('draw');
    ['playerName','roomName','joinPlayerName','roomCode','guessInput'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
    });
    clearCanvas && clearCanvas();
}

function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
