<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gartic Phone</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#ff6b6b;--secondary:#4ecdc4;--accent:#ffe66d;--dark:#1a1a2e;
  --purple:#7c4dff;--shadow-lg:0 20px 60px rgba(0,0,0,.18);--r:14px;
}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px;color:var(--dark)}
.container{max-width:1280px;margin:0 auto}
.header{text-align:center;margin-bottom:32px}
.logo{font-size:46px;font-weight:900;background:linear-gradient(135deg,#ff6b6b,#ffe66d,#4ecdc4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-2px}
.tagline{color:#ffffffcc;font-size:15px;margin-top:4px}
.card{background:#fff;border-radius:var(--r);padding:26px;box-shadow:var(--shadow-lg)}
.card-title{font-size:22px;font-weight:800;margin-bottom:18px;color:var(--dark)}

/* ── buttons ── */
button{padding:13px 22px;border:none;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;transition:all .25s;font-family:inherit;letter-spacing:.6px}
button:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.btn-primary{background:linear-gradient(135deg,var(--primary),#ff5252);color:#fff;box-shadow:0 4px 14px rgba(255,107,107,.35)}
.btn-primary:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(255,107,107,.45)}
.btn-secondary{background:linear-gradient(135deg,var(--secondary),#45b8aa);color:#fff;box-shadow:0 4px 14px rgba(78,205,196,.35)}
.btn-secondary:not(:disabled):hover{transform:translateY(-2px)}
.btn-purple{background:linear-gradient(135deg,#7c4dff,#651fff);color:#fff;box-shadow:0 4px 14px rgba(124,77,255,.35)}
.btn-purple:not(:disabled):hover{transform:translateY(-2px)}
.btn-small{padding:7px 13px;font-size:12px}
.btn-full{width:100%;margin-top:10px}

/* ── inputs ── */
.input-group{margin-bottom:14px}
.input-group label{display:block;font-weight:700;margin-bottom:6px;font-size:13px}
.input-group input,.input-group select{width:100%;padding:11px 14px;border:2px solid #e0e0e0;border-radius:9px;font-size:14px;transition:all .3s;font-family:inherit;background:#fff}
.input-group input:focus,.input-group select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(255,107,107,.1)}

/* ── info boxes ── */
.info-box{padding:12px 16px;border-radius:9px;margin-bottom:14px;font-size:13px;border-left:4px solid}
.info-blue{background:#e3f2fd;border-color:#2196f3;color:#0d47a1}
.info-green{background:#e8f5e9;border-color:#4caf50;color:#2e7d32}
.info-orange{background:#fff3e0;border-color:#ff9800;color:#e65100}
.info-purple{background:#ede7f6;border-color:#7c4dff;color:#4527a0}

/* ── tabs ── */
.setup-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.tab-btn{padding:13px;background:#f0f0f0;border:2px solid transparent;border-radius:9px;cursor:pointer;font-weight:700;transition:all .3s;letter-spacing:0;font-size:14px}
.tab-btn.active{background:linear-gradient(135deg,var(--primary),#ff5252);color:#fff}

/* ── layout states ── */
.screen{display:none}
.screen.active{display:block}

/* ── mode select ── */
.modes-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.mode-card{padding:18px 12px;border:2px solid #e0e0e0;border-radius:12px;cursor:pointer;text-align:center;transition:all .25s;background:#fafafa;position:relative}
.mode-card:hover{border-color:var(--purple);background:#f3efff;transform:translateY(-2px)}
.mode-card.selected{border-color:var(--purple);background:#ede7f6;box-shadow:0 0 0 3px rgba(124,77,255,.2)}
.mode-card .mode-icon{font-size:30px;margin-bottom:6px}
.mode-card .mode-name{font-weight:800;font-size:13px;letter-spacing:.5px;color:var(--dark)}
.mode-card .mode-desc{font-size:11px;color:#888;margin-top:3px;line-height:1.4}
.mode-card .mode-badge{position:absolute;top:6px;right:8px;font-size:10px;padding:2px 7px;border-radius:20px;font-weight:700}
.badge-new{background:#fff3cd;color:#856404}
.badge-hot{background:#fde8e8;color:#9b1c1c}

/* ── game layout ── */
.game-layout{display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:start}
.sidebar{}
.main-area{}

/* ── players list ── */
.players-list{padding:12px;background:#f9f9f9;border-radius:9px;max-height:260px;overflow-y:auto;margin-top:10px}
.player-item{padding:9px 12px;background:#fff;border-radius:7px;margin-bottom:7px;font-size:13px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.player-item:last-child{margin-bottom:0}
.badge{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:700}
.badge-host{background:#fff3cd;color:#856404}
.badge-ready{background:#d1f7e0;color:#166534}
.badge-done{background:#e3f2fd;color:#0d47a1}

/* ── turn indicator ── */
.turn-indicator{padding:12px 16px;background:linear-gradient(135deg,var(--accent),#ffd54f);border-radius:9px;margin-bottom:14px;font-weight:800;text-align:center;color:var(--dark);font-size:14px}

/* ── canvas ── */
.canvas-wrap{border-radius:10px;overflow:hidden;box-shadow:inset 0 0 0 2px #e0e0e0;margin-bottom:14px;background:#fff;position:relative}
canvas{display:block;cursor:crosshair;width:100%;background:#fff}

/* ── tools ── */
.tools-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.color-picker{width:44px;height:44px;border:none;border-radius:8px;cursor:pointer;flex-shrink:0}
.slider-group{display:flex;flex-direction:column;gap:3px;flex:1;min-width:80px}
.slider-group label{font-size:11px;font-weight:700;color:#666}
input[type=range]{cursor:pointer;width:100%}
.tool-buttons{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tool-btn{padding:9px 14px;background:#f0f0f0;border:2px solid transparent;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;transition:all .2s;text-transform:none;letter-spacing:0}
.tool-btn.active{background:var(--accent);border-color:var(--primary)}
.tool-btn:hover:not(.active){background:#e0e0e0}

/* ── phase panels ── */
.phase-panel{display:none}
.phase-panel.active{display:block}

/* ── guess ── */
.guess-input{width:100%;padding:14px 16px;border:2px solid #e0e0e0;border-radius:9px;font-size:16px;margin-bottom:12px;font-family:inherit}
.guess-input:focus{outline:none;border-color:var(--secondary)}

/* ── chain / results ── */
.chain-display{background:#f9f9f9;border-radius:9px;padding:18px;margin-bottom:18px;max-height:500px;overflow-y:auto}
.chain-item{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid #eee}
.chain-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.chain-player{font-weight:800;color:var(--primary);font-size:11px;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.chain-content{font-size:15px;color:var(--dark);font-style:italic}
.chain-image{width:100%;border-radius:7px;margin-top:6px;border:1px solid #e0e0e0}

/* ── score board ── */
.scoreboard{display:grid;gap:8px}
.score-row{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.score-rank{font-size:20px;width:32px;text-align:center}
.score-name{flex:1;font-weight:700}
.score-pts{font-size:18px;font-weight:900;color:var(--primary)}

/* ── mode-specific ── */
.prompt-box{padding:12px 16px;background:#fff3cd;border-radius:9px;border-left:4px solid var(--accent);margin-bottom:14px}
.timer-bar-wrap{height:8px;background:#e0e0e0;border-radius:4px;overflow:hidden;margin-bottom:12px}
.timer-bar{height:100%;background:linear-gradient(90deg,#4caf50,#ffeb3b,#f44336);border-radius:4px;transition:width .5s linear}

/* ── sandwich split canvas ── */
.split-canvas-wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ── coopoverlay ── */
.co-note{font-size:12px;color:#888;margin-bottom:8px}

code{background:#f0f0f0;padding:3px 8px;border-radius:5px;font-size:13px;letter-spacing:2px}
@media(max-width:800px){
  .game-layout{grid-template-columns:1fr}
  .modes-grid{grid-template-columns:repeat(2,1fr)}
  .logo{font-size:32px}
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">Gartic Phone</div>
    <div class="tagline">Draw it. Guess it. Share the chaos.</div>
  </div>

  <!-- ══════════════ SETUP SCREEN ══════════════ -->
  <div id="screenSetup" class="screen active">
    <div class="card" style="max-width:520px;margin:0 auto">
      <div class="card-title">Welcome 🎨</div>
      <div id="firebaseStatus" class="info-box info-blue">⏳ Connecting…</div>
      <div class="setup-tabs">
        <button class="tab-btn active" id="tabCreate" onclick="switchTab('create')">Create Room</button>
        <button class="tab-btn" id="tabJoin" onclick="switchTab('join')">Join Room</button>
      </div>

      <!-- create -->
      <div id="createTab">
        <div class="input-group"><label>Your Name</label><input id="playerName" placeholder="e.g. SketchMaster" maxlength="20"></div>
        <div class="input-group"><label>Room Name</label><input id="roomName" placeholder="Fun Room" maxlength="30"></div>
        <div class="input-group"><label>Max Players (2–8)</label><input id="maxPlayers" type="number" min="2" max="8" value="4"></div>
        <button class="btn-purple btn-full" onclick="goModeSelect()">Choose Game Mode →</button>
      </div>

      <!-- join -->
      <div id="joinTab" style="display:none">
        <div class="input-group"><label>Your Name</label><input id="joinPlayerName" placeholder="Your name" maxlength="20"></div>
        <div class="input-group"><label>Room Code</label><input id="roomCode" placeholder="6-character code" maxlength="6" style="text-transform:uppercase"></div>
        <button class="btn-primary btn-full" onclick="joinRoom()">Join Room</button>
      </div>
    </div>
  </div>

  <!-- ══════════════ MODE SELECT ══════════════ -->
  <div id="screenMode" class="screen">
    <div class="card" style="max-width:700px;margin:0 auto">
      <div class="card-title">Choose Game Mode</div>
      <div class="modes-grid" id="modesGrid">
        <!-- injected by JS -->
      </div>
      <div id="modeDesc" class="info-box info-purple" style="min-height:44px"></div>
      <div style="display:flex;gap:10px;margin-top:4px">
        <button class="btn-secondary" style="flex:1" onclick="showScreen('screenSetup')">← Back</button>
        <button class="btn-primary" style="flex:2" id="modeConfirmBtn" onclick="createRoom()">Create Room →</button>
      </div>
    </div>
  </div>

  <!-- ══════════════ GAME SCREEN ══════════════ -->
  <div id="screenGame" class="screen">
    <div class="game-layout">

      <!-- sidebar -->
      <div class="card sidebar">
        <div class="card-title" id="sideRoomName" style="font-size:18px;margin-bottom:8px">Room</div>
        <div style="margin-bottom:12px">
          <strong>Code:</strong> <code id="codeDisplay">-</code>
          <button class="btn-secondary btn-small" style="margin-left:8px" onclick="copyCode()">Copy</button>
        </div>
        <div class="turn-indicator" id="turnIndicator">Waiting…</div>
        <div id="minPlayerNote" class="info-box info-orange" style="display:none">⚠️ Need ≥2 players to start.</div>
        <div id="modeTag" class="info-box info-purple" style="margin-bottom:10px"></div>

        <div style="font-weight:800;font-size:14px;margin-bottom:4px">
          Players <span id="playerCount" style="color:#aaa;font-weight:400;font-size:12px"></span>
        </div>
        <div class="players-list" id="playersList"></div>

        <button class="btn-primary btn-full" id="startBtn" onclick="startGame()" disabled>Start Game</button>
        <button class="btn-secondary btn-full" onclick="leaveRoom()" style="margin-top:10px">Leave Room</button>
      </div>

      <!-- main area -->
      <div class="card main-area">
        <div class="turn-indicator" id="gamePhaseLabel">Lobby</div>

        <!-- DRAW PHASE -->
        <div id="panelDraw" class="phase-panel active">
          <div class="card-title" style="font-size:17px" id="drawTitle">Your Turn to Draw</div>
          <div id="timerWrap" class="timer-bar-wrap" style="display:none"><div class="timer-bar" id="timerBar"></div></div>
          <div class="prompt-box"><strong id="promptDisplay">Waiting to start…</strong></div>
          <div class="tools-row">
            <input type="color" id="brushColor" class="color-picker" value="#000000" title="Color">
            <div class="slider-group">
              <label>Size: <span id="sizeVal">5</span>px</label>
              <input type="range" id="brushSize" min="1" max="50" value="5" oninput="sizeVal.textContent=this.value">
            </div>
            <div class="slider-group">
              <label>Opacity: <span id="opacVal">100</span>%</label>
              <input type="range" id="brushOpacity" min=".05" max="1" step=".05" value="1" oninput="opacVal.textContent=Math.round(this.value*100)">
            </div>
          </div>
          <div class="tool-buttons">
            <button class="tool-btn active" id="toolDraw" onclick="selectTool('draw')">🖌️ Draw</button>
            <button class="tool-btn" id="toolEraser" onclick="selectTool('eraser')">🧹 Eraser</button>
            <button class="tool-btn" onclick="fillBucket()">🪣 Fill</button>
            <button class="tool-btn" onclick="clearCanvas()">🗑️ Clear</button>
            <button class="tool-btn" id="toolUndo" onclick="undoCanvas()">↩️ Undo</button>
          </div>
          <div class="canvas-wrap" id="drawCanvasWrap">
            <canvas id="drawingCanvas" height="420"></canvas>
          </div>
          <button class="btn-primary btn-full" onclick="submitDrawing()">Submit Drawing ✓</button>
        </div>

        <!-- GUESS PHASE -->
        <div id="panelGuess" class="phase-panel">
          <div class="card-title" style="font-size:17px">What is this? 🤔</div>
          <div id="timerWrap2" class="timer-bar-wrap" style="display:none"><div class="timer-bar" id="timerBar2"></div></div>
          <div class="canvas-wrap">
            <canvas id="displayCanvas" height="420"></canvas>
          </div>
          <input class="guess-input" id="guessInput" placeholder="Type your guess…" autocomplete="off" onkeydown="if(event.key==='Enter')submitGuess()">
          <button class="btn-primary btn-full" onclick="submitGuess()">Submit Guess ✓</button>
        </div>

        <!-- SCORE PHASE (Score mode) -->
        <div id="panelScore" class="phase-panel">
          <div class="card-title" style="font-size:17px">Rate this drawing! ⭐</div>
          <div class="canvas-wrap">
            <canvas id="scoreCanvas" height="380"></canvas>
          </div>
          <div style="margin-bottom:14px">
            <label style="font-weight:700;font-size:13px;display:block;margin-bottom:8px">Your Rating:</label>
            <div style="display:flex;gap:8px;justify-content:center;font-size:32px" id="starRating">
              <span class="star" data-v="1" onclick="rateStar(1)" style="cursor:pointer">⭐</span>
              <span class="star" data-v="2" onclick="rateStar(2)" style="cursor:pointer">⭐</span>
              <span class="star" data-v="3" onclick="rateStar(3)" style="cursor:pointer">⭐</span>
              <span class="star" data-v="4" onclick="rateStar(4)" style="cursor:pointer">⭐</span>
              <span class="star" data-v="5" onclick="rateStar(5)" style="cursor:pointer">⭐</span>
            </div>
          </div>
          <button class="btn-primary btn-full" onclick="submitScore()">Submit Rating ✓</button>
        </div>

        <!-- RESULTS / CHAIN -->
        <div id="panelResults" class="phase-panel">
          <div class="card-title" id="resultsTitle">🎉 The Chain!</div>
          <div class="chain-display" id="chainContent"></div>
          <div id="scoreboardWrap" style="display:none;margin-bottom:16px">
            <div class="card-title" style="font-size:17px">🏆 Scoreboard</div>
            <div class="scoreboard" id="scoreboardList"></div>
          </div>
          <button class="btn-secondary btn-full" onclick="leaveRoom()">Play Again 🔄</button>
        </div>

      </div><!-- /main-area -->
    </div><!-- /game-layout -->
  </div><!-- /screenGame -->

</div><!-- /container -->

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
// ═══════════════════════════════════════════════════════
//  FIREBASE
// ═══════════════════════════════════════════════════════
firebase.initializeApp({
  apiKey:"AIzaSyDdwdbP8tsEGKWW88NR9C3StYMhTmecujM",
  authDomain:"gartic-phone-ea498.firebaseapp.com",
  databaseURL:"https://gartic-phone-ea498-default-rtdb.firebaseio.com",
  projectId:"gartic-phone-ea498",
  storageBucket:"gartic-phone-ea498.firebasestorage.app",
  messagingSenderId:"425033124791",
  appId:"1:425033124791:web:0388821e8eaa37a4673632"
});
const db = firebase.database();

document.addEventListener('DOMContentLoaded',()=>{
  setStatus('green','✓ Firebase connected! Create or join a room.');
  document.getElementById('roomCode').addEventListener('input',function(){this.value=this.value.toUpperCase()});
  buildModeGrid();
});

// ═══════════════════════════════════════════════════════
//  GAME MODES
// ═══════════════════════════════════════════════════════
const MODES = [
  { id:'normal',    icon:'📝', name:'NORMAL',          desc:'Classic! Write a prompt → draw it → guess → repeat down the chain.',       hot:false, new:false },
  { id:'knockoff',  icon:'🃏', name:'KNOCK-OFF',        desc:'Everyone draws the same prompt simultaneously. See all the wild versions!', hot:true,  new:false },
  { id:'animation', icon:'🎬', name:'ANIMATION',        desc:'Draw 3 frames to make a mini animation, then others guess what it shows.',  hot:false, new:false },
  { id:'icebreaker',icon:'🧊', name:'ICEBREAKER',       desc:'Fun warm-up! Answer a silly question with a quick drawing.',               hot:false, new:false },
  { id:'exquisite', icon:'🎭', name:'EXQUISITE CORPSE', desc:'Each player draws only one section of a body — then reveal the monster!',  hot:false, new:true  },
  { id:'complement',icon:'🖼️', name:'COMPLEMENT',       desc:'Draw the missing half of your partner\'s picture.',                        hot:false, new:false },
  { id:'masterpiece',icon:'🖼', name:'MASTERPIECE',     desc:'Recreate a famous painting from memory. Others rate how close you got!',   hot:false, new:false },
  { id:'story',     icon:'📖', name:'STORY',            desc:'Build a story together: alternating sentences and drawings.',               hot:false, new:false },
  { id:'score',     icon:'🏆', name:'SCORE',            desc:'Rate each drawing! Players earn points based on votes.',                    hot:true,  new:false },
  { id:'secret',    icon:'🕵️', name:'SECRET',           desc:'One player gets a secret word. Others draw clues without revealing it.',   hot:false, new:true  },
  { id:'coop',      icon:'🤝', name:'CO-OP',            desc:'Everyone draws on the SAME canvas at the same time!',                      hot:false, new:true  },
  { id:'sandwich',  icon:'🥪', name:'SANDWICH',         desc:'Draw the top half, pass it; the next player draws the bottom half.',       hot:false, new:false },
];

let selectedMode = 'normal';

function buildModeGrid(){
  const grid = document.getElementById('modesGrid');
  grid.innerHTML = MODES.map(m=>`
    <div class="mode-card ${m.id==='normal'?'selected':''}" id="mc_${m.id}" onclick="selectMode('${m.id}')">
      ${m.hot?'<span class="mode-badge badge-hot">🔥 HOT</span>':''}
      ${m.new?'<span class="mode-badge badge-new">✨ NEW</span>':''}
      <div class="mode-icon">${m.icon}</div>
      <div class="mode-name">${m.name}</div>
    </div>`).join('');
  selectMode('normal');
}

function selectMode(id){
  selectedMode = id;
  document.querySelectorAll('.mode-card').forEach(c=>c.classList.remove('selected'));
  document.getElementById('mc_'+id).classList.add('selected');
  const m = MODES.find(x=>x.id===id);
  document.getElementById('modeDesc').innerHTML = `<strong>${m.icon} ${m.name}:</strong> ${m.desc}`;
}

function goModeSelect(){
  const name = document.getElementById('playerName').value.trim();
  if(!name){alert('Please enter your name.');return;}
  showScreen('screenMode');
}

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
const gs = {
  playerName:'', playerId:null, roomId:null, roomName:'',
  isHost:false, players:{}, mode:'normal',
  currentTool:'draw', mouseDown:false, lastX:0, lastY:0,
  undoStack:[], chain:[], currentTurn:0,
  scores:{},  myRating:0,
  listeners:[], timerInterval:null
};

// ═══════════════════════════════════════════════════════
//  ROOM CREATE / JOIN
// ═══════════════════════════════════════════════════════
function createRoom(){
  const name = document.getElementById('playerName').value.trim();
  if(!name){alert('Enter your name.');return;}
  gs.playerName = name;
  gs.playerId   = 'p_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
  gs.roomId     = Math.random().toString(36).substring(2,8).toUpperCase();
  gs.roomName   = document.getElementById('roomName').value.trim()||'Fun Room';
  gs.isHost     = true;
  gs.mode       = selectedMode;
  const maxPlayers = Math.min(8,Math.max(2,parseInt(document.getElementById('maxPlayers').value)||4));
  db.ref('rooms/'+gs.roomId).set({
    name:gs.roomName, maxPlayers, host:gs.playerId, phase:'lobby', mode:gs.mode,
    createdAt:firebase.database.ServerValue.TIMESTAMP,
    players:{ [gs.playerId]:{name:gs.playerName,isHost:true,status:'ready'} }
  }).then(enterRoom).catch(e=>alert('Error: '+e.message));
}

function joinRoom(){
  const name = document.getElementById('joinPlayerName').value.trim();
  const code = document.getElementById('roomCode').value.trim().toUpperCase();
  if(!name){alert('Enter your name.');return;}
  if(!code){alert('Enter a room code.');return;}
  gs.playerName=name; gs.playerId='p_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
  gs.roomId=code; gs.isHost=false;
  db.ref('rooms/'+code).once('value').then(snap=>{
    const room=snap.val();
    if(!room){alert('Room not found.');return;}
    if(room.phase!=='lobby'){alert('Game already started.');return;}
    if(Object.keys(room.players||{}).length>=room.maxPlayers){alert('Room is full!');return;}
    gs.roomName=room.name; gs.mode=room.mode||'normal';
    db.ref('rooms/'+code+'/players/'+gs.playerId)
      .set({name:gs.playerName,isHost:false,status:'ready'})
      .then(enterRoom).catch(e=>alert('Error: '+e.message));
  }).catch(e=>alert('Error: '+e.message));
}

function enterRoom(){
  document.getElementById('sideRoomName').textContent = gs.roomName;
  document.getElementById('codeDisplay').textContent  = gs.roomId;
  const modeInfo = MODES.find(m=>m.id===gs.mode)||MODES[0];
  document.getElementById('modeTag').innerHTML = modeInfo.icon+' <strong>'+modeInfo.name+'</strong> mode';
  showScreen('screenGame');
  initCanvas();
  attachListeners();
  db.ref('rooms/'+gs.roomId+'/players/'+gs.playerId).onDisconnect().remove();
}

// ═══════════════════════════════════════════════════════
//  FIREBASE LISTENERS
// ═══════════════════════════════════════════════════════
function attachListeners(){
  const rPlayers = db.ref('rooms/'+gs.roomId+'/players');
  rPlayers.on('value',snap=>{ gs.players=snap.val()||{}; renderPlayers(); });
  gs.listeners.push(rPlayers);

  const rPhase = db.ref('rooms/'+gs.roomId+'/phase');
  rPhase.on('value',snap=>handlePhaseChange(snap.val()));
  gs.listeners.push(rPhase);

  const rPrompt = db.ref('rooms/'+gs.roomId+'/currentPrompt');
  rPrompt.on('value',snap=>{ if(snap.val()) document.getElementById('promptDisplay').textContent=snap.val(); });
  gs.listeners.push(rPrompt);

  const rDrawing = db.ref('rooms/'+gs.roomId+'/currentDrawing');
  rDrawing.on('value',snap=>{ if(snap.val()) renderDisplayCanvas(snap.val()); });
  gs.listeners.push(rDrawing);

  const rScores = db.ref('rooms/'+gs.roomId+'/scores');
  rScores.on('value',snap=>{ gs.scores=snap.val()||{}; });
  gs.listeners.push(rScores);
}

function detachListeners(){ gs.listeners.forEach(r=>r.off()); gs.listeners=[]; }

function handlePhaseChange(phase){
  if(!phase) return;
  stopTimer();
  if(phase==='lobby'){
    showPanel('draw');
    document.getElementById('gamePhaseLabel').textContent='🏠 Lobby';
  } else if(phase==='draw'){
    document.getElementById('gamePhaseLabel').textContent='✏️ Draw Phase';
    showPanel('draw');
    // Timer for animation/icebreaker (60s)
    if(['animation','icebreaker'].includes(gs.mode)) startTimer(60,'timerBar','timerWrap');
  } else if(phase==='guess'){
    document.getElementById('gamePhaseLabel').textContent='🤔 Guess Phase';
    showPanel('guess');
    if(gs.mode==='score') showPanel('score');
    if(['animation','icebreaker'].includes(gs.mode)) startTimer(45,'timerBar2','timerWrap2');
  } else if(phase==='done'){
    buildResults();
  }
}

// ═══════════════════════════════════════════════════════
//  PLAYERS RENDER
// ═══════════════════════════════════════════════════════
function renderPlayers(){
  const entries = Object.entries(gs.players);
  document.getElementById('playerCount').textContent='('+entries.length+')';
  document.getElementById('playersList').innerHTML = entries.length===0
    ? '<div class="player-item"><span style="color:#aaa">Nobody here yet…</span></div>'
    : entries.map(([id,p])=>`
        <div class="player-item">
          <span>${esc(p.name)}${id===gs.playerId?' <em style="color:#bbb;font-size:11px">(you)</em>':''}</span>
          <span class="badge ${p.isHost?'badge-host':p.status==='done'?'badge-done':'badge-ready'}">${p.isHost?'👑 Host':p.status==='done'?'✓ Done':'✓ Ready'}</span>
        </div>`).join('');
  const n = entries.length;
  const canStart = gs.isHost && n>=2;
  document.getElementById('startBtn').disabled = !canStart;
  document.getElementById('minPlayerNote').style.display = gs.isHost&&n<2?'block':'none';
  document.getElementById('turnIndicator').textContent = n<2?'Waiting for players…':n+' player'+(n>1?'s':'')+' ready!';
}

// ═══════════════════════════════════════════════════════
//  GAME START & PROMPTS
// ═══════════════════════════════════════════════════════
const PROMPTS_NORMAL = ['A cat riding a bicycle','A haunted pizza','A dinosaur at the dentist',
  'A robot eating spaghetti','A fish playing guitar','An astronaut grocery shopping',
  'A dog driving a bus','A penguin at the beach','A wizard doing laundry',
  'A bear baking cupcakes','A shark at a birthday party','A snail winning a race',
  'A cow in a spaceship','A pirate doing yoga','A giraffe using an ATM'];

const PROMPTS_ICEBREAKER = ['What did you eat for breakfast?','Your spirit animal',
  'Your current mood','Your biggest fear','A hobby you wish you had',
  'If you were a superhero','Your dream vacation'];

const PROMPTS_STORY = ['Once upon a time in a distant galaxy…','It was a dark and stormy night…',
  'The robot opened its eyes for the first time…','Nobody expected the penguin to arrive…'];

const PROMPTS_MASTERPIECE = ['Starry Night','Mona Lisa','The Scream','American Gothic',
  'Girl with a Pearl Earring','The Last Supper'];

const PROMPTS_SECRET = ['The Eiffel Tower','Pizza','A dinosaur','The internet',
  'Love','A black hole','Time travel','Money'];

function randFrom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function startGame(){
  if(!gs.isHost) return;
  const n = Object.keys(gs.players).length;
  if(n<2){alert('Need at least 2 players!');return;}
  let prompt='';
  switch(gs.mode){
    case 'icebreaker': prompt=randFrom(PROMPTS_ICEBREAKER); break;
    case 'story':      prompt=randFrom(PROMPTS_STORY); break;
    case 'masterpiece':prompt='Recreate: "'+randFrom(PROMPTS_MASTERPIECE)+'"'; break;
    case 'secret':     prompt='SECRET WORD: '+randFrom(PROMPTS_SECRET)+'\n(Only the drawer knows!)'; break;
    default:           prompt=randFrom(PROMPTS_NORMAL);
  }
  clearCanvas();
  db.ref('rooms/'+gs.roomId).update({ phase:'draw', currentPrompt:prompt, currentDrawing:null, scores:{} });
}

// ═══════════════════════════════════════════════════════
//  CANVAS
// ═══════════════════════════════════════════════════════
let canvas, ctx, dispCanvas, dispCtx, scoreCanv, scoreCtx;

function initCanvas(){
  canvas    = document.getElementById('drawingCanvas');   ctx      = canvas.getContext('2d');
  dispCanvas= document.getElementById('displayCanvas');   dispCtx  = dispCanvas.getContext('2d');
  scoreCanv = document.getElementById('scoreCanvas');     scoreCtx = scoreCanv.getContext('2d');

  function resize(){
    [canvas,dispCanvas,scoreCanv].forEach(c=>{
      c.width = c.parentElement.clientWidth||600;
      c.height = 420;
    });
  }
  resize();
  window.addEventListener('resize',resize);

  canvas.addEventListener('mousedown', e=>{gs.mouseDown=true; setLast(e); saveUndo();});
  canvas.addEventListener('mousemove', doDraw);
  canvas.addEventListener('mouseup',   ()=>gs.mouseDown=false);
  canvas.addEventListener('mouseleave',()=>gs.mouseDown=false);
  canvas.addEventListener('touchstart',e=>{e.preventDefault();gs.mouseDown=true;setLast(e.touches[0]);saveUndo();},{passive:false});
  canvas.addEventListener('touchmove', e=>{e.preventDefault();doDraw(e.touches[0]);},{passive:false});
  canvas.addEventListener('touchend',  ()=>gs.mouseDown=false);
}

function setLast(e){const r=canvas.getBoundingClientRect();gs.lastX=e.clientX-r.left;gs.lastY=e.clientY-r.top;}

function doDraw(e){
  if(!gs.mouseDown) return;
  const r=canvas.getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top;
  ctx.globalAlpha = parseFloat(document.getElementById('brushOpacity').value);
  if(gs.currentTool==='eraser'){
    const s=parseInt(document.getElementById('brushSize').value)*2;
    ctx.clearRect(x-s/2,y-s/2,s,s);
  } else {
    ctx.strokeStyle=document.getElementById('brushColor').value;
    ctx.lineWidth=document.getElementById('brushSize').value;
    ctx.lineCap=ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(gs.lastX,gs.lastY); ctx.lineTo(x,y); ctx.stroke();
  }
  gs.lastX=x; gs.lastY=y;
}

function selectTool(t){
  gs.currentTool=t;
  document.getElementById('toolDraw').classList.toggle('active',t==='draw');
  document.getElementById('toolEraser').classList.toggle('active',t==='eraser');
}

function clearCanvas(){
  ctx.globalAlpha=1;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // white bg
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.globalAlpha=1;
  gs.undoStack=[];
}

function saveUndo(){
  gs.undoStack.push(ctx.getImageData(0,0,canvas.width,canvas.height));
  if(gs.undoStack.length>20) gs.undoStack.shift();
}

function undoCanvas(){
  if(gs.undoStack.length===0) return;
  ctx.putImageData(gs.undoStack.pop(),0,0);
}

function fillBucket(){
  const color=document.getElementById('brushColor').value;
  ctx.globalAlpha=parseFloat(document.getElementById('brushOpacity').value);
  ctx.fillStyle=color;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.globalAlpha=1;
}

function renderDisplayCanvas(dataUrl){
  const img=new Image();
  img.onload=()=>{
    dispCtx.clearRect(0,0,dispCanvas.width,dispCanvas.height);
    dispCtx.drawImage(img,0,0,dispCanvas.width,dispCanvas.height);
    // also copy to score canvas for rating
    scoreCtx.clearRect(0,0,scoreCanv.width,scoreCanv.height);
    scoreCtx.drawImage(img,0,0,scoreCanv.width,scoreCanv.height);
  };
  img.src=dataUrl;
}

// ═══════════════════════════════════════════════════════
//  TIMER
// ═══════════════════════════════════════════════════════
function startTimer(secs, barId, wrapId){
  document.getElementById(wrapId).style.display='block';
  const bar=document.getElementById(barId);
  let left=secs;
  bar.style.width='100%';
  gs.timerInterval=setInterval(()=>{
    left--;
    bar.style.width=Math.max(0,(left/secs*100))+'%';
    if(left<=0){ stopTimer(); }
  },1000);
}
function stopTimer(){
  clearInterval(gs.timerInterval);
  gs.timerInterval=null;
  ['timerWrap','timerWrap2'].forEach(id=>{const el=document.getElementById(id);if(el)el.style.display='none';});
}

// ═══════════════════════════════════════════════════════
//  SUBMIT DRAWING
// ═══════════════════════════════════════════════════════
function submitDrawing(){
  const dataUrl=canvas.toDataURL('image/jpeg',0.75);
  gs.chain.push({type:'drawing',player:gs.playerName,content:dataUrl,mode:gs.mode});

  // Mark self as done so others can see
  db.ref('rooms/'+gs.roomId+'/players/'+gs.playerId+'/status').set('done');

  if(gs.mode==='knockoff'){
    // everyone draws simultaneously — just store your drawing and wait
    db.ref('rooms/'+gs.roomId+'/drawings/'+gs.playerId).set({player:gs.playerName,data:dataUrl});
    db.ref('rooms/'+gs.roomId+'/phase').set('guess');
  } else {
    db.ref('rooms/'+gs.roomId).update({phase:'guess',currentDrawing:dataUrl});
  }
}

// ═══════════════════════════════════════════════════════
//  SUBMIT GUESS
// ═══════════════════════════════════════════════════════
function submitGuess(){
  const guess=document.getElementById('guessInput').value.trim();
  if(!guess) return;
  gs.chain.push({type:'guess',player:gs.playerName,content:guess});
  document.getElementById('guessInput').value='';
  gs.currentTurn++;

  db.ref('rooms/'+gs.roomId+'/players/'+gs.playerId+'/status').set('done');

  const total=Object.keys(gs.players).length;
  if(gs.currentTurn>=total){
    db.ref('rooms/'+gs.roomId+'/phase').set('done');
  } else {
    const nextPrompt='Last guess: "'+guess+'"';
    clearCanvas();
    db.ref('rooms/'+gs.roomId).update({phase:'draw',currentPrompt:nextPrompt,currentDrawing:null});
  }
}

// ═══════════════════════════════════════════════════════
//  SCORE MODE
// ═══════════════════════════════════════════════════════
function rateStar(v){
  gs.myRating=v;
  document.querySelectorAll('.star').forEach((s,i)=>{
    s.style.filter=i<v?'none':'grayscale(1) opacity(.4)';
  });
}

function submitScore(){
  if(!gs.myRating){alert('Please pick a star rating!');return;}
  db.ref('rooms/'+gs.roomId+'/scores/'+gs.playerId).set(gs.myRating);
  gs.myRating=0;
  document.querySelectorAll('.star').forEach(s=>s.style.filter='');
  // after scoring, go to results if everyone has scored
  db.ref('rooms/'+gs.roomId+'/phase').set('done');
}

// ═══════════════════════════════════════════════════════
//  BUILD RESULTS
// ═══════════════════════════════════════════════════════
function buildResults(){
  stopTimer();
  showPanel('results');
  document.getElementById('gamePhaseLabel').textContent='🎉 Game Over!';

  // Chain
  document.getElementById('chainContent').innerHTML = gs.chain.length===0
    ? '<p style="color:#aaa;text-align:center">No chain data — play a full round to see results!</p>'
    : gs.chain.map((item,i)=>
        item.type==='drawing'
          ? `<div class="chain-item"><div class="chain-player">${i+1}. ${esc(item.player)} drew:</div><img src="${item.content}" class="chain-image" alt="drawing"></div>`
          : `<div class="chain-item"><div class="chain-player">${i+1}. ${esc(item.player)} guessed:</div><div class="chain-content">"${esc(item.content)}"</div></div>`
      ).join('');

  // Scoreboard (score mode)
  if(gs.mode==='score' && Object.keys(gs.scores).length>0){
    document.getElementById('scoreboardWrap').style.display='block';
    const entries=Object.entries(gs.scores)
      .map(([id,pts])=>({name:(gs.players[id]||{name:'?'}).name,pts}))
      .sort((a,b)=>b.pts-a.pts);
    const medals=['🥇','🥈','🥉'];
    document.getElementById('scoreboardList').innerHTML=entries.map((e,i)=>`
      <div class="score-row">
        <span class="score-rank">${medals[i]||'#'+(i+1)}</span>
        <span class="score-name">${esc(e.name)}</span>
        <span class="score-pts">${e.pts} ⭐</span>
      </div>`).join('');
  }

  document.getElementById('resultsTitle').textContent = {
    normal:'🎉 The Chain!', knockoff:'🃏 All Drawings!', animation:'🎬 Animation Results!',
    icebreaker:'🧊 Icebreaker Results!', exquisite:'🎭 The Monster!',
    complement:'🖼️ The Full Picture!', masterpiece:'🖼 Masterpieces!',
    story:'📖 The Story!', score:'🏆 Scores!', secret:'🕵️ Secret Revealed!',
    coop:'🤝 Co-op Result!', sandwich:'🥪 The Sandwich!'
  }[gs.mode]||'🎉 Results!';
}

// ═══════════════════════════════════════════════════════
//  UI HELPERS
// ═══════════════════════════════════════════════════════
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showPanel(name){
  // name: 'draw' | 'guess' | 'score' | 'results'
  ['panelDraw','panelGuess','panelScore','panelResults'].forEach(id=>
    document.getElementById(id).classList.remove('active'));
  const map={draw:'panelDraw',guess:'panelGuess',score:'panelScore',results:'panelResults'};
  if(map[name]) document.getElementById(map[name]).classList.add('active');
}

function switchTab(tab){
  document.getElementById('createTab').style.display=tab==='create'?'block':'none';
  document.getElementById('joinTab').style.display=tab==='join'?'block':'none';
  document.getElementById('tabCreate').classList.toggle('active',tab==='create');
  document.getElementById('tabJoin').classList.toggle('active',tab==='join');
}

function setStatus(color,html){
  const el=document.getElementById('firebaseStatus');
  el.className='info-box info-'+color; el.innerHTML=html;
}

function copyCode(){ navigator.clipboard.writeText(gs.roomId).then(()=>alert('Room code copied!')); }

function leaveRoom(){
  if(!confirm('Leave the room?')) return;
  stopTimer(); detachListeners();
  if(gs.playerId&&gs.roomId) db.ref('rooms/'+gs.roomId+'/players/'+gs.playerId).remove();
  Object.assign(gs,{playerName:'',playerId:null,roomId:null,roomName:'',isHost:false,
    players:{},chain:[],currentTurn:0,scores:{},myRating:0,
    currentTool:'draw',mouseDown:false,undoStack:[]});
  showScreen('screenSetup');
  showPanel('draw');
  ['playerName','roomName','joinPlayerName','roomCode','guessInput'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.value='';
  });
  if(ctx) clearCanvas();
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
